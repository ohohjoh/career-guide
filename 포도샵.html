<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>포도샵 · 이미지 작업대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Black+Han+Sans&family=Do+Hyeon&family=Gaegu:wght@400;700&family=Gothic+A1:wght@400;700;900&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Jua&family=Lobster&family=Montserrat:wght@400;700;900&family=Nanum+Gothic:wght@400;700;800&family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Pen+Script&family=Oswald:wght@400;700&family=Pacifico&family=Playfair+Display:wght@400;700;900&family=Poppins:wght@400;600;800&family=Song+Myung&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1113; --panel:#171b1e; --panel2:#1e2429; --panel3:#232b31;
  --line:#2a333a; --line2:#374049;
  --ink:#e8edf0; --mut:#8b98a3; --mut2:#5f6b74;
  --amber:#f0b23c; --amber-d:#c8901f; --amber-g:rgba(240,178,60,.14);
  --danger:#e0645a; --ok:#5fbf7a; --blue:#5aa0e0;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",system-ui,sans-serif;
  --r:9px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:2px solid var(--panel)}
::-webkit-scrollbar-track{background:transparent}

.app{display:grid;grid-template-rows:46px 1fr 28px;height:100dvh;height:100vh}

/* ---- top bar ---- */
.top{display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);z-index:20}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.2px;padding-right:6px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber)}
.brand small{font-family:var(--mono);font-size:9.5px;letter-spacing:2px;color:var(--mut);font-weight:500}
.brand .klogo{width:26px;height:26px;flex-shrink:0;filter:drop-shadow(0 0 3px rgba(94,231,255,.35))}
.brand .kname{font-weight:800;font-size:15px;letter-spacing:-.3px}
.sep{width:1px;height:22px;background:var(--line);margin:0 2px}
.tbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-size:12.5px;transition:.12s}
.tbtn:hover{background:var(--panel3);border-color:var(--line2)}
.tbtn:disabled{opacity:.4;cursor:default}
.tbtn.acc{background:var(--amber);color:#20160a;border-color:var(--amber);font-weight:700}
.tbtn.acc:hover{background:#ffc24d}
.tbtn svg{width:14px;height:14px}
.spread{flex:1}
.zoomwrap{display:flex;align-items:center;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px}
.zoomwrap button{width:26px;height:24px;border-radius:6px;color:var(--mut);font-size:15px}
.zoomwrap button:hover{background:var(--panel3);color:var(--ink)}
.zoomwrap .zval{min-width:50px;text-align:center;font-family:var(--mono);font-size:11.5px;color:var(--mut)}

/* ---- mid ---- */
.mid{display:grid;grid-template-columns:56px 258px 1fr 244px;min-height:0}

/* toolbar rail */
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:3px;overflow-y:auto}
.tool{width:42px;height:42px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mut);position:relative;transition:.1s}
.tool svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tool span{font-size:8.5px;letter-spacing:-.2px}
.tool:hover{background:var(--panel2);color:var(--ink)}
.tool.on{background:var(--amber-g);color:var(--amber)}
.tool.on::before{content:"";position:absolute;left:-8px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--amber)}
.rail .rsep{width:26px;height:1px;background:var(--line);margin:5px 0}

/* stage */
.stagewrap{position:relative;background:
   radial-gradient(120% 120% at 50% 0%,#12161a 0%,#0b0e10 70%);
   overflow:hidden;min-width:0}
#stage{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.emptyhint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none;color:var(--mut2);text-align:center}
.emptyhint.hide{display:none}
.emptyhint .big{font-size:15px;color:var(--mut)}
.emptyhint svg{width:46px;height:46px;stroke:var(--line2);fill:none;stroke-width:1.4}
.emptyhint .keys{display:flex;gap:6px;font-family:var(--mono);font-size:10.5px}
.emptyhint kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:2px 6px}
.stage.draghot::after{content:"이미지를 여기에 놓으세요";position:absolute;inset:12px;border:2px dashed var(--amber);border-radius:14px;background:var(--amber-g);display:flex;align-items:center;justify-content:center;color:var(--amber);font-weight:700;font-size:15px;z-index:5;pointer-events:none}

/* inspector (attached to rail, left of stage) + layers (far right) */
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.insp{flex:1;overflow-y:auto;overflow-x:hidden}
.insp-empty{padding:40px 18px;text-align:center;color:var(--mut2);font-size:12px;line-height:1.6}
.insp-head{display:flex;align-items:center;gap:8px;padding:13px 14px 9px}
.insp-head h2{font-size:14px;font-weight:700;letter-spacing:-.3px}
.insp-head .tag{margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--amber);border:1px solid var(--amber-d);padding:2px 5px;border-radius:5px}
.insp-desc{padding:0 14px 10px;color:var(--mut);font-size:11.5px;line-height:1.5}
.grp{padding:11px 14px;border-top:1px solid var(--line)}
.grp:first-child{border-top:none}
.lab{font-size:10.5px;letter-spacing:.3px;color:var(--mut);text-transform:uppercase;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.lab .v{font-family:var(--mono);color:var(--amber);text-transform:none;font-size:11px}

.row{display:flex;gap:7px;align-items:center}
.row+.row{margin-top:7px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 10px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);color:var(--mut);font-size:11.5px;transition:.1s;white-space:nowrap}
.chip:hover{border-color:var(--line2);color:var(--ink)}
.chip.on{background:var(--amber);color:#20160a;border-color:var(--amber);font-weight:700}
.chip.sm{padding:5px 8px;font-size:11px}

.btn{width:100%;padding:9px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-size:12.5px;font-weight:600;transition:.12s;text-align:center}
.btn:hover{background:var(--panel3);border-color:var(--line2)}
.btn.acc{background:var(--amber);color:#20160a;border-color:var(--amber)}
.btn.acc:hover{background:#ffc24d}
.btn.ghost{background:transparent}
.btn.danger:hover{background:rgba(224,100,90,.14);border-color:var(--danger);color:var(--danger)}
.btn2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.btn3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}

input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:3px;background:var(--line2);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--amber);cursor:pointer;border:2px solid var(--panel);box-shadow:0 1px 4px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--amber);cursor:pointer;border:2px solid var(--panel)}

.tin{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:8px 9px;font-size:12.5px}
.tin:focus{outline:none;border-color:var(--amber-d);background:var(--panel3)}
textarea.tin{resize:vertical;min-height:64px;line-height:1.4}
.num{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:7px 8px;font-family:var(--mono);font-size:12px;text-align:center}
.num:focus{outline:none;border-color:var(--amber-d)}
.field{flex:1}
.field .fl{font-size:10px;color:var(--mut);margin-bottom:4px;display:block}

.swatch{width:34px;height:34px;border-radius:8px;border:2px solid var(--line2);padding:0;overflow:hidden;position:relative;flex-shrink:0}
.swatch input{position:absolute;inset:-4px;width:150%;height:150%;cursor:pointer;border:none;background:none}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:4px 4px 4px 11px;font-size:11.5px;color:var(--mut)}
.pill b{color:var(--ink);font-family:var(--mono)}

.toggle{width:38px;height:22px;border-radius:12px;background:var(--line2);position:relative;transition:.15s;flex-shrink:0}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.toggle.on{background:var(--amber)}
.toggle.on::after{left:18px}

.hint{font-size:11px;color:var(--mut2);line-height:1.5;margin-top:8px}

/* layers — dedicated far-right column, full height */
.layers{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.layers-head{display:flex;align-items:center;gap:6px;padding:14px 14px 10px;font-size:11px;letter-spacing:.4px;color:var(--mut);text-transform:uppercase}
.layers-head .cnt{font-family:var(--mono);color:var(--amber)}
.layers-head .add{margin-left:auto;display:flex;gap:4px}
.laddbtn{width:28px;height:26px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--mut);display:flex;align-items:center;justify-content:center}
.laddbtn:hover{color:var(--amber);border-color:var(--amber-d)}
.laddbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.llist{flex:1;overflow-y:auto;padding:0 10px 10px}
.llist .lempty{padding:28px 10px;text-align:center;color:var(--mut2);font-size:11.5px;line-height:1.6}
.litem{display:flex;align-items:center;gap:9px;padding:9px;border-radius:9px;margin-top:5px;background:var(--panel2);border:1px solid transparent;transition:.1s;cursor:pointer}
.litem:hover{background:var(--panel3)}
.litem.sel{border-color:var(--amber-d);background:var(--amber-g)}
.leye{width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--mut);flex-shrink:0}
.leye:hover{color:var(--ink)}
.leye.off{color:var(--mut2)}
.leye svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5}
.lthumb{width:42px;height:42px;border-radius:7px;background:
  conic-gradient(#2a2f34 25%,#1c2126 0 50%,#2a2f34 0 75%,#1c2126 0) 0/14px 14px;
  border:1px solid var(--line);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.lthumb canvas{max-width:100%;max-height:100%;display:block}
.lthumb .ic{color:var(--mut);font-size:14px}
.lname{flex:1;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lname input{width:100%;background:var(--panel);border:1px solid var(--amber-d);border-radius:5px;color:var(--ink);padding:3px 6px;font-size:12.5px}
.lmeta{font-size:10px;color:var(--mut2);font-family:var(--mono);margin-top:2px}
.ltools{display:flex;gap:4px;padding:10px;border-top:1px solid var(--line)}
.ltbtn{flex:1;height:32px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);color:var(--mut);display:flex;align-items:center;justify-content:center}
.ltbtn:hover{color:var(--ink);border-color:var(--line2)}
.ltbtn:disabled{opacity:.35;cursor:default}
.ltbtn.dz:hover{color:var(--danger);border-color:var(--danger)}
.ltbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tbtn.on{background:var(--amber-g);color:var(--amber);border-color:var(--amber-d)}
/* layer lock + drag reorder + group */
.llock{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--mut2);flex-shrink:0}
.llock:hover{color:var(--ink)}
.llock.on{color:var(--amber)}
.llock svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6}
.litem.locked{opacity:.72}
.litem.multi{border-color:var(--blue)}
.litem.grouped{box-shadow:inset 3px 0 0 var(--blue)}
.litem.drag-over{border-color:var(--amber);border-style:dashed}
.litem.dragging{opacity:.4}
.lgrip{cursor:grab;color:var(--mut2);flex-shrink:0;display:flex;align-items:center}
.lgrip svg{width:12px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5}
/* align grid */
.aligns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.aligns button{height:34px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);color:var(--mut);display:flex;align-items:center;justify-content:center}
.aligns button:hover{color:var(--amber);border-color:var(--amber-d)}
.aligns svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round}
/* curves editor */
.curvebox{position:relative;width:100%;aspect-ratio:1;background:var(--panel2);border:1px solid var(--line);border-radius:9px;overflow:hidden;touch-action:none}
.curvebox canvas{position:absolute;inset:0;width:100%;height:100%}


/* ---- AI help chat (FactChat) ---- */
.aihelp{border-top:1px solid var(--line);background:linear-gradient(180deg,var(--panel) 0%,#12171b 100%);padding:12px;display:flex;flex-direction:column;gap:9px;height:340px;flex-shrink:0}
.aihelp-head{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--ink)}
.aihelp-head b{display:block;font-size:12.5px;letter-spacing:-.2px}
.aihelp-head span{display:block;margin-top:2px;font-family:var(--mono);font-size:9px;color:var(--mut);letter-spacing:1px;text-transform:uppercase}
.ai-mini{height:25px;padding:0 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--mut);font-size:11px;white-space:nowrap}
.ai-mini:hover{background:var(--panel3);color:var(--ink);border-color:var(--line2)}
.ai-mini.acc{background:var(--amber);border-color:var(--amber);color:#20160a;font-weight:700}
.ai-log{flex:1;min-height:86px;overflow-y:auto;background:rgba(0,0,0,.16);border:1px solid var(--line);border-radius:9px;padding:8px;display:flex;flex-direction:column;gap:7px}
.ai-msg{max-width:96%;padding:7px 9px;border-radius:9px;font-size:11.5px;line-height:1.45;white-space:pre-wrap;user-select:text;-webkit-user-select:text}
.ai-msg.bot{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);color:var(--ink)}
.ai-msg.user{align-self:flex-end;background:var(--amber-g);border:1px solid var(--amber-d);color:var(--ink)}
.ai-msg.err{align-self:flex-start;background:rgba(224,100,90,.14);border:1px solid var(--danger);color:#ffbbb6}
.ai-keyrow,.ai-form{display:flex;gap:6px}
.ai-key,.ai-form input{min-width:0;flex:1;height:30px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:0 9px;font-size:11.5px}
.ai-key:focus,.ai-form input:focus{outline:none;border-color:var(--amber-d);background:var(--panel3)}
.ai-form button{height:30px;padding:0 10px;border-radius:7px;background:var(--amber);border:1px solid var(--amber);color:#20160a;font-size:11.5px;font-weight:700}
.ai-form button:disabled{opacity:.55;cursor:default}
.ai-note{font-size:10px;color:var(--mut2);line-height:1.35}

/* HUD status */
.hud{display:flex;align-items:center;gap:0;background:var(--panel);border-top:1px solid var(--line);padding:0 4px;font-family:var(--mono);font-size:11px;overflow-x:auto}
.hud .cell{display:flex;align-items:center;gap:6px;padding:0 12px;height:100%;white-space:nowrap;color:var(--mut)}
.hud .cell+.cell{border-left:1px solid var(--line)}
.hud .cell b{color:var(--amber);font-weight:600}
.hud .cell .k{color:var(--mut2);font-size:9.5px;letter-spacing:.5px;text-transform:uppercase}
.hud .pxsw{width:13px;height:13px;border-radius:3px;border:1px solid var(--line2)}
.hud .push{margin-left:auto}

/* file input hidden */
.hidden{display:none}

/* modal (batch/export overlays if needed) */
.modal{position:fixed;inset:0;background:rgba(6,8,10,.72);backdrop-filter:blur(3px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal-card{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:min(560px,100%);max-height:86vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal-card h2{padding:16px 18px;font-size:15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.modal-card h2 .x{margin-left:auto;color:var(--mut);font-size:20px;line-height:1}
.modal-body{padding:16px 18px}
.drop{border:2px dashed var(--line2);border-radius:12px;padding:26px;text-align:center;color:var(--mut);transition:.12s}
.drop.hot{border-color:var(--amber);background:var(--amber-g);color:var(--amber)}
.blist{margin-top:12px;max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:5px}
.brow{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:11.5px}
.brow .bn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bs{font-family:var(--mono);color:var(--mut)}
.bprog{height:5px;border-radius:3px;background:var(--line2);overflow:hidden;margin-top:10px}
.bprog i{display:block;height:100%;width:0;background:var(--amber);transition:.2s}

.toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel3);border:1px solid var(--line2);color:var(--ink);padding:9px 16px;border-radius:10px;font-size:12.5px;opacity:0;transition:.2s;z-index:200;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@keyframes ants{to{background-position:16px 0,16px 0,0 -16px,0 -16px}}

/* responsive */
@media(max-width:1180px){
  .mid{grid-template-columns:54px 232px 1fr 200px}
}
@media(max-width:720px){
  .app{grid-template-rows:44px 1fr 26px}
  .mid{grid-template-columns:1fr!important;grid-template-rows:1fr auto auto}
  .rail{position:absolute;left:0;top:44px;bottom:auto;z-index:30;flex-direction:row;width:100%;height:52px;padding:0 6px;border-right:none;border-bottom:1px solid var(--line);overflow-x:auto}
  .rail .rsep{width:1px;height:26px;margin:0 4px}
  .tool.on::before{left:9px;top:auto;bottom:-8px;right:9px;width:auto;height:3px;border-radius:3px 3px 0 0}
  .stagewrap{grid-column:1;grid-row:1;margin-top:52px}
  .side{display:flex;grid-column:1;grid-row:2;width:100%;border-left:none;border-right:none;border-top:1px solid var(--line);max-height:38vh}
  .layers{grid-column:1;grid-row:3;width:100%;border-left:none;max-height:30vh}
  .layers{grid-column:1;grid-row:3;width:100%;border-left:none;max-height:30vh}
  .brand small{display:none}
}

@media(max-width:720px){
  .aihelp{height:300px}
  .ai-log{min-height:72px}
}

</style>
</head>
<body>
<div class="app">
  <!-- TOP -->
  <div class="top">

<script>
"use strict";
/* ============================================================
   이미지 작업대 — 단일 파일 레이어 편집기
   ============================================================ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const uid=()=>'L'+Math.random().toString(36).slice(2,8);
const dpr=()=>Math.min(window.devicePixelRatio||1,2);

function newCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c;}
function copyCanvas(src){const c=newCanvas(src.width,src.height);c.getContext('2d').drawImage(src,0,0);return c;}
function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255];}
function fmtKB(b){return b<1024?b+' B':b<1048576?(b/1024).toFixed(0)+' KB':(b/1048576).toFixed(2)+' MB';}
function gcd(a,b){return b?gcd(b,a%b):a;}
function ratioStr(w,h){const g=gcd(w,h)||1;let rw=w/g,rh=h/g;if(rw>40||rh>40){const r=w/h;const t=[[16,9],[9,16],[4,3],[3,4],[4,5],[5,4],[1,1],[3,2],[2,3],[21,9]];let best=t[0],bd=9;for(const[a,b]of t){const d=Math.abs(a/b-r);if(d<bd){bd=d;best=[a,b];}}return best[0]+':'+best[1]+'≈';}return rw+':'+rh;}

/* ---------- global state ---------- */
const S={
  cw:1080, ch:1080, bg:'#ffffff',   // artboard
  layers:[], sel:null, selex:[],     // selex = additional multi-selected ids
  tool:'move',
  color:'#f0b23c', color2:'#ffffff',
  undo:[], redo:[],
  brush:{size:24, hard:1}, shapeType:'rect', shapeFill:false,
  origBytes:0, fileName:'image',
  groupSeq:1, safeArea:false, snap:true, cropMode:'image',
};
const view={zoom:1, ox:0, oy:0};
let docCanvas=newCanvas(S.cw,S.ch), dctx=docCanvas.getContext('2d');
let stage=$('#stage'), sctx=stage.getContext('2d');
let drag=null;               // active pointer interaction
let adjCache=null;           // {id, base} for live adjust preview
let hoverDoc={x:0,y:0,inside:false};

/* ---------- layer factory ---------- */
function addLayer(L,{select=true,history=true}={}){
  if(history)pushHistory();
  L.id=L.id||uid();
  L.visible=L.visible!==false; L.opacity=L.opacity??1;
  S.layers.push(L);
  if(select)S.sel=L.id;
  renderAll(); renderLayers(); renderInsp();
  return L;
}
function getSel(){return S.layers.find(l=>l.id===S.sel)||null;}
function layerBBox(L){
  if(L.type==='raster')return{x:0,y:0,w:S.cw,h:S.ch};
  if(L.type==='text'){measureText(L);return{x:L.x,y:L.y,w:L._w,h:L._h};}
  if(L.type==='image'&&L.warp){const xs=L.warp.map(p=>p.x),ys=L.warp.map(p=>p.y);const x=Math.min(...xs),y=Math.min(...ys);return{x,y,w:Math.max(...xs)-x,h:Math.max(...ys)-y};}
  return{x:L.x,y:L.y,w:L.w,h:L.h};   // image, shape
}

/* ---------- text measuring ---------- */
const _m=newCanvas(4,4).getContext('2d');
function fontStr(L){return (L.italic?'italic ':'')+(L.weight||600)+' '+L.size+'px '+L.font;}
function measureText(L){
  const lines=(L.text||'').split('\n');
  _m.font=fontStr(L);
  if(_m.letterSpacing!==undefined)_m.letterSpacing=(L.tracking||0)+'px';
  const lh=L.size*(L.lineHeight||1.25);
  let w=0;for(const t of lines){const m=_m.measureText(t||' ').width;if(m>w)w=m;}
  L._w=Math.max(w,8); L._h=Math.max(lines.length*lh,L.size);
  L._lh=lh; L._lines=lines;
}

/* ---------- draw a single layer to a ctx ---------- */
function drawLayer(ctx,L){
  if(!L.visible)return;
  ctx.save();
  ctx.globalAlpha=L.opacity;
  if(L.type==='raster'){ ctx.drawImage(L.bmp,0,0); ctx.restore(); return; }
  if(L.type==='image'&&L.warp){ drawWarpImage(ctx,L); ctx.restore(); return; }
  const bb=layerBBox(L);
  const cx=bb.x+bb.w/2, cy=bb.y+bb.h/2, rot=(L.rot||0)*Math.PI/180;
  ctx.translate(cx,cy); ctx.rotate(rot); ctx.translate(-cx,-cy);
  if(L.flipH||L.flipV){ctx.translate(cx,cy);ctx.scale(L.flipH?-1:1,L.flipV?-1:1);ctx.translate(-cx,-cy);}
  if(L.type==='image'){
    const r=Math.min(L.radius||0,Math.abs(L.w)/2,Math.abs(L.h)/2);
    if(r>0){ctx.save();roundRect(ctx,L.x,L.y,L.w,L.h,r);ctx.clip();ctx.drawImage(L.bmp,L.x,L.y,L.w,L.h);ctx.restore();}
    else ctx.drawImage(L.bmp,L.x,L.y,L.w,L.h);
    if(L.borderW>0){ctx.lineWidth=L.borderW;ctx.strokeStyle=L.borderColor||'#ffffff';roundRect(ctx,L.x+L.borderW/2,L.y+L.borderW/2,L.w-L.borderW,L.h-L.borderW,Math.max(0,r-L.borderW/2));ctx.stroke();}
  }else if(L.type==='shape'){
    drawShape(ctx,L);
  }else if(L.type==='text'){
    drawText(ctx,L);
  }
  ctx.restore();
}
/* perspective/free-transform image via triangle mesh (bilinear) */
function warpQuad(L){return L.warp;}
function bilerp(c,u,v){return{x:(1-u)*(1-v)*c[0].x+u*(1-v)*c[1].x+u*v*c[2].x+(1-u)*v*c[3].x,
                              y:(1-u)*(1-v)*c[0].y+u*(1-v)*c[1].y+u*v*c[2].y+(1-u)*v*c[3].y};}
function drawWarpImage(ctx,L){
  const bmp=L.bmp,c=L.warp,N=14,iw=bmp.width,ih=bmp.height;
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){
    const u0=i/N,u1=(i+1)/N,v0=j/N,v1=(j+1)/N;
    const p00=bilerp(c,u0,v0),p10=bilerp(c,u1,v0),p11=bilerp(c,u1,v1),p01=bilerp(c,u0,v1);
    const sx0=u0*iw,sx1=u1*iw,sy0=v0*ih,sy1=v1*ih;
    tri(ctx,bmp,sx0,sy0,sx1,sy0,sx1,sy1,p00,p10,p11);
    tri(ctx,bmp,sx0,sy0,sx1,sy1,sx0,sy1,p00,p11,p01);
  }
}
function tri(ctx,img,sx0,sy0,sx1,sy1,sx2,sy2,d0,d1,d2){
  ctx.save();
  ctx.beginPath();ctx.moveTo(d0.x,d0.y);ctx.lineTo(d1.x,d1.y);ctx.lineTo(d2.x,d2.y);ctx.closePath();ctx.clip();
  const denom=sx0*(sy2-sy1)-sx1*sy2+sx2*sy1+(sx1-sx2)*sy0;
  if(Math.abs(denom)<1e-6){ctx.restore();return;}
  const a=(d0.x*(sy2-sy1)-d1.x*sy2+d2.x*sy1+(d1.x-d2.x)*sy0)/denom;
  const b=(d0.y*(sy2-sy1)-d1.y*sy2+d2.y*sy1+(d1.y-d2.y)*sy0)/denom;
  const cc=(sx0*(d2.x-d1.x)-sx1*d2.x+sx2*d1.x+(sx1-sx2)*d0.x)/denom;
  const dd=(sx0*(d2.y-d1.y)-sx1*d2.y+sx2*d1.y+(sx1-sx2)*d0.y)/denom;
  const e=(sx0*(sy2*d1.x-sy1*d2.x)+sy0*(sx1*d2.x-sx2*d1.x)+(sx2*sy1-sx1*sy2)*d0.x)/denom;
  const f=(sx0*(sy2*d1.y-sy1*d2.y)+sy0*(sx1*d2.y-sx2*d1.y)+(sx2*sy1-sx1*sy2)*d0.y)/denom;
  ctx.transform(a,b,cc,dd,e,f);
  ctx.drawImage(img,0,0);
  ctx.restore();
}
function drawShape(ctx,L){
  const {x,y,w,h}=L;
  ctx.lineWidth=L.strokeW; ctx.strokeStyle=L.stroke; ctx.fillStyle=L.fill;
  ctx.lineJoin='round'; ctx.lineCap='round';
  if(L.shape==='rect'){
    const r=Math.min(L.radius||0,Math.abs(w)/2,Math.abs(h)/2);
    roundRect(ctx,x,y,w,h,r);
    if(L.fillOn)ctx.fill(); if(L.strokeW>0)ctx.stroke();
  }else if(L.shape==='ellipse'){
    ctx.beginPath();ctx.ellipse(x+w/2,y+h/2,Math.abs(w/2),Math.abs(h/2),0,0,7);
    if(L.fillOn)ctx.fill(); if(L.strokeW>0)ctx.stroke();
  }else if(L.shape==='line'||L.shape==='arrow'){
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w,y+h);ctx.stroke();
    if(L.shape==='arrow'){
      const a=Math.atan2(h,w),len=Math.max(10,L.strokeW*3.2);
      const ex=x+w,ey=y+h;
      ctx.beginPath();
      ctx.moveTo(ex,ey);ctx.lineTo(ex-len*Math.cos(a-0.4),ey-len*Math.sin(a-0.4));
      ctx.moveTo(ex,ey);ctx.lineTo(ex-len*Math.cos(a+0.4),ey-len*Math.sin(a+0.4));
      ctx.stroke();
    }
  }
}
function drawText(ctx,L){
  measureText(L);
  ctx.font=fontStr(L); ctx.textBaseline='top';
  if(ctx.letterSpacing!==undefined)ctx.letterSpacing=(L.tracking||0)+'px';
  const draw=(ox,oy)=>{
    if(L.boxOn){
      ctx.save();ctx.fillStyle=L.boxColor;ctx.globalAlpha=(L.opacity)*(L.boxAlpha??1);
      const p=L.boxPad??10;roundRect(ctx,L.x-p+ox,L.y-p+oy,L._w+p*2,L._h+p*2,L.boxRadius||0);ctx.fill();ctx.restore();
    }
    if(L.shadow){ctx.shadowColor=L.shadowColor||'rgba(0,0,0,.5)';ctx.shadowBlur=L.shadowBlur||8;ctx.shadowOffsetX=L.shadowDX||0;ctx.shadowOffsetY=L.shadowDY||2;}
    L._lines.forEach((t,i)=>{
      const lw=_m.measureText(t||' ').width;
      let lx=L.x+ox;
      if(L.align==='center')lx=L.x+ox+(L._w-lw)/2;
      else if(L.align==='right')lx=L.x+ox+(L._w-lw);
      const ly=L.y+oy+i*L._lh;
      if(L.strokeW>0){ctx.lineWidth=L.strokeW*2;ctx.strokeStyle=L.strokeColor;ctx.lineJoin='round';ctx.strokeText(t,lx,ly);}
      ctx.fillStyle=L.color;ctx.fillText(t,lx,ly);
    });
    ctx.shadowColor='transparent';ctx.shadowBlur=0;
  };
  if(L.tile){
    const gx=L._w+ (L.tileGap||120), gy=L._h+(L.tileGap||120);
    ctx.save();ctx.globalAlpha=L.opacity;
    for(let ty=-gy;ty<S.ch+gy;ty+=gy)for(let tx=-gx;tx<S.cw+gx;tx+=gx)draw(tx- L.x + (ty/gy%2?gx/2:0),ty-L.y);
    ctx.restore();
  }else draw(0,0);
}
function roundRect(ctx,x,y,w,h,r){
  if(w<0){x+=w;w=-w;} if(h<0){y+=h;h=-h;}
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

/* ---------- composite doc ---------- */
function renderDoc(){
  if(docCanvas.width!==S.cw||docCanvas.height!==S.ch){docCanvas.width=S.cw;docCanvas.height=S.ch;}
  dctx.clearRect(0,0,S.cw,S.ch);
  if(S.bg!=='transparent'){dctx.fillStyle=S.bg;dctx.fillRect(0,0,S.cw,S.ch);}
  for(const L of S.layers)drawLayer(dctx,L);
}

/* ---------- view fit / transforms ---------- */
function fitView(){
  const w=stagewrap.clientWidth,h=stagewrap.clientHeight,pad=48;
  const z=Math.min((w-pad)/S.cw,(h-pad)/S.ch);
  view.zoom=clamp(z,0.02,8);
  view.ox=(w-S.cw*view.zoom)/2; view.oy=(h-S.ch*view.zoom)/2;
}
const stagewrap=$('#stagewrap');
function s2d(px,py){return{x:(px-view.ox)/view.zoom,y:(py-view.oy)/view.zoom};}
function d2s(x,y){return{x:x*view.zoom+view.ox,y:y*view.zoom+view.oy};}
function evtDoc(e){const r=stage.getBoundingClientRect();return s2d(e.clientX-r.left,e.clientY-r.top);}
function evtStage(e){const r=stage.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}

/* ---------- render stage (view) ---------- */
function sizeStage(){
  const r=stagewrap.getBoundingClientRect(),d=dpr();
  stage.width=Math.max(1,Math.round(r.width*d));stage.height=Math.max(1,Math.round(r.height*d));
  stage.style.width=r.width+'px';stage.style.height=r.height+'px';
  sctx.setTransform(d,0,0,d,0,0);
}
const CHK='__chk';
function checkerPattern(){
  if(sctx[CHK])return sctx[CHK];
  const c=newCanvas(20,20),x=c.getContext('2d');
  x.fillStyle='#12161a';x.fillRect(0,0,20,20);
  x.fillStyle='#1a2025';x.fillRect(0,0,10,10);x.fillRect(10,10,10,10);
  return sctx[CHK]=sctx.createPattern(c,'repeat');
}
function renderView(){
  renderDoc();
  const w=stage.clientWidth,h=stage.clientHeight;
  sctx.clearRect(0,0,w,h);
  const p=d2s(0,0), pw=S.cw*view.zoom, ph=S.ch*view.zoom;
  // artboard shadow
  sctx.save();sctx.shadowColor='rgba(0,0,0,.5)';sctx.shadowBlur=30;sctx.shadowOffsetY=8;
  sctx.fillStyle='#000';sctx.fillRect(p.x,p.y,pw,ph);sctx.restore();
  // transparent bg checker
  if(S.bg==='transparent'){sctx.fillStyle=checkerPattern();sctx.save();sctx.translate(p.x,p.y);sctx.fillRect(0,0,pw,ph);sctx.restore();}

  sctx.strokeStyle='rgba(255,255,255,.08)';sctx.lineWidth=1;sctx.strokeRect(p.x+.5,p.y+.5,pw,ph);
  if(S.safeArea)drawSafeArea();
  drawSelection();
  if(drag&&drag.guides)drawSnapGuides(drag.guides);

function renderAll(){renderView();updateHUD();$('#emptyhint').classList.toggle('hide',S.layers.length>0);}

/* ---------- selection handles ---------- */
function selectedIds(){const ids=new Set(S.selex);if(S.sel)ids.add(S.sel);return[...ids];}
function drawBoxOutline(L,color){
  const bb=layerBBox(L),rot=(L.rot||0)*Math.PI/180,cx=bb.x+bb.w/2,cy=bb.y+bb.h/2;
  const corners=[[bb.x,bb.y],[bb.x+bb.w,bb.y],[bb.x+bb.w,bb.y+bb.h],[bb.x,bb.y+bb.h]].map(([x,y])=>{
    const dx=x-cx,dy=y-cy;return d2s(cx+dx*Math.cos(rot)-dy*Math.sin(rot),cy+dx*Math.sin(rot)+dy*Math.cos(rot));});
  sctx.save();sctx.strokeStyle=color;sctx.lineWidth=1.5;
  sctx.beginPath();sctx.moveTo(corners[0].x,corners[0].y);for(let i=1;i<4;i++)sctx.lineTo(corners[i].x,corners[i].y);sctx.closePath();sctx.stroke();sctx.restore();
  return corners;
}
function drawSelection(){
  if(S.tool!=='move'&&S.tool!=='text')return;
  // secondary selections (multi)
  for(const id of S.selex){const L=S.layers.find(l=>l.id===id);if(L&&L.visible&&id!==S.sel)drawBoxOutline(L,'rgba(90,160,224,.9)');}
  const L=getSel();if(!L||!L.visible)return;
  // warped image: draw quad with 4 corner handles
  if(L.type==='image'&&L.warp){
    const pts=L.warp.map(p=>d2s(p.x,p.y));
    sctx.save();sctx.strokeStyle='#f0b23c';sctx.lineWidth=1.5;sctx.beginPath();sctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<4;i++)sctx.lineTo(pts[i].x,pts[i].y);sctx.closePath();sctx.stroke();
    for(const c of pts){sctx.fillStyle='#fff';sctx.strokeStyle='#c8901f';sctx.lineWidth=1.5;sctx.beginPath();sctx.arc(c.x,c.y,5.5,0,7);sctx.fill();sctx.stroke();}
    sctx.restore();return;
  }
  const corners=drawBoxOutline(L,'#f0b23c');
  if(L.type!=='raster'&&!L.locked){
    const hs=(L.rot?[]:handlePts(layerBBox(L))).map(pt=>d2s(pt.x,pt.y));
    for(const c of [...corners,...hs]){sctx.fillStyle='#fff';sctx.strokeStyle='#c8901f';sctx.lineWidth=1.5;
      sctx.beginPath();sctx.rect(c.x-4,c.y-4,8,8);sctx.fill();sctx.stroke();}
  }
  if(L.locked){const bb=layerBBox(L),m=d2s(bb.x+bb.w/2,bb.y);sctx.save();sctx.fillStyle='#f0b23c';sctx.font='11px sans-serif';sctx.textAlign='center';sctx.fillText('🔒 잠김',m.x,m.y-8);sctx.restore();}
}
function warpCornerAt(e){
  const L=getSel();if(!L||!L.warp)return -1;const sp=evtStage(e);
  for(let i=0;i<4;i++){const s=d2s(L.warp[i].x,L.warp[i].y);if(Math.hypot(s.x-sp.x,s.y-sp.y)<11)return i;}
  return -1;
}
/* ---------- SNS safe-area overlay ---------- */
function drawSafeArea(){
  const p=d2s(0,0),z=view.zoom,W=S.cw,H=S.ch;
  sctx.save();
  const rectD=(x,y,w,h)=>{sctx.strokeRect(p.x+x*z,p.y+y*z,w*z,h*z);};
  const label=(t,x,y)=>{sctx.fillStyle='rgba(240,178,60,.95)';sctx.font='600 '+Math.max(10,11)+'px sans-serif';sctx.fillText(t,p.x+x*z+6,p.y+y*z+15);};
  // profile-grid 1:1 center crop (Instagram grid shows center square)
  const sq=Math.min(W,H),sx=(W-sq)/2,sy=(H-sq)/2;
  if(sq<Math.max(W,H)-1){
    sctx.save();sctx.beginPath();sctx.rect(p.x,p.y,W*z,H*z);sctx.rect(p.x+sx*z,p.y+sy*z,sq*z,sq*z);
    sctx.fillStyle='rgba(224,100,90,.14)';sctx.fill('evenodd');sctx.restore();
    sctx.strokeStyle='rgba(224,100,90,.8)';sctx.lineWidth=1.5;sctx.setLineDash([7,5]);rectD(sx,sy,sq,sq);sctx.setLineDash([]);
    sctx.fillStyle='rgba(224,100,90,.95)';sctx.font='600 11px sans-serif';sctx.fillText('프로필 그리드 1:1 (바깥은 잘림)',p.x+sx*z+6,p.y+sy*z+16);
  }
  // story/reels UI-safe zone for tall canvases
  if(H/W>1.5){
    const top=0.13,bot=0.20;
    sctx.fillStyle='rgba(90,160,224,.14)';
    sctx.fillRect(p.x,p.y,W*z,H*top*z);sctx.fillRect(p.x,p.y+H*(1-bot)*z,W*z,H*bot*z);
    sctx.strokeStyle='rgba(90,160,224,.85)';sctx.lineWidth=1.2;sctx.setLineDash([6,4]);
    rectD(0,H*top,W,H*(1-top-bot));sctx.setLineDash([]);
    label('상단 UI 영역',6/z,H*top-20/z);label('하단 UI 영역',6/z,H*(1-bot));
  }
  // generic 5% text-safe inset
  const m=0.05;sctx.strokeStyle='rgba(95,191,122,.7)';sctx.lineWidth=1;sctx.setLineDash([3,4]);rectD(W*m,H*m,W*(1-2*m),H*(1-2*m));sctx.setLineDash([]);
  sctx.restore();
}
/* ---------- snap guides ---------- */
function drawSnapGuides(gs){
  sctx.save();sctx.strokeStyle='#5aa0e0';sctx.lineWidth=1;
  const p=d2s(0,0),z=view.zoom;
  for(const g of gs){
    if(g.v!=null){const x=p.x+g.v*z;sctx.beginPath();sctx.moveTo(x,p.y);sctx.lineTo(x,p.y+S.ch*z);sctx.stroke();}
    if(g.h!=null){const y=p.y+g.h*z;sctx.beginPath();sctx.moveTo(p.x,y);sctx.lineTo(p.x+S.cw*z,y);sctx.stroke();}
  }
  sctx.restore();
}
function handlePts(bb){ // edge midpoints (only when not rotated)
  return[{x:bb.x+bb.w/2,y:bb.y,h:'n'},{x:bb.x+bb.w,y:bb.y+bb.h/2,h:'e'},
         {x:bb.x+bb.w/2,y:bb.y+bb.h,h:'s'},{x:bb.x,y:bb.y+bb.h/2,h:'w'}];
}
function hitHandle(e){
  const L=getSel();if(!L||L.type==='raster'||L.rot||L.locked||(L.type==='image'&&L.warp))return null;
  const bb=layerBBox(L),sp=evtStage(e);
  const all=[{x:bb.x,y:bb.y,h:'nw'},{x:bb.x+bb.w,y:bb.y,h:'ne'},{x:bb.x+bb.w,y:bb.y+bb.h,h:'se'},{x:bb.x,y:bb.y+bb.h,h:'sw'},...handlePts(bb)];
  for(const pt of all){const s=d2s(pt.x,pt.y);if(Math.hypot(s.x-sp.x,s.y-sp.y)<9)return pt.h;}
  return null;
}
let antsOffset=0, antsRAF=0;
function startAnts(){if(antsRAF)return;const loop=()=>{if(S.tool!=='crop'){antsRAF=0;return;}antsOffset=(antsOffset+0.6)%16;renderView();antsRAF=requestAnimationFrame(loop);};antsRAF=requestAnimationFrame(loop);}
function marquee(a,b,dim){
  const x=Math.min(a.x,b.x),y=Math.min(a.y,b.y),w=Math.abs(b.x-a.x),h=Math.abs(b.y-a.y);
  if(dim){ // darken outside within artboard
    const p=d2s(0,0),pw=S.cw*view.zoom,ph=S.ch*view.zoom;
    sctx.save();sctx.beginPath();sctx.rect(p.x,p.y,pw,ph);sctx.rect(x,y,w,h);
    sctx.fillStyle='rgba(8,10,12,.5)';sctx.fill('evenodd');sctx.restore();
  }
  sctx.save();
  sctx.lineWidth=1;sctx.setLineDash([5,4]);
  sctx.strokeStyle='rgba(0,0,0,.6)';sctx.lineDashOffset=-antsOffset;sctx.strokeRect(x+.5,y+.5,w,h);
  sctx.strokeStyle='#fff';sctx.lineDashOffset=-antsOffset+4;sctx.strokeRect(x+.5,y+.5,w,h);
  sctx.setLineDash([]);
  // rule of thirds
  sctx.strokeStyle='rgba(255,255,255,.28)';sctx.lineWidth=1;sctx.beginPath();
  for(let i=1;i<3;i++){sctx.moveTo(x+w*i/3,y);sctx.lineTo(x+w*i/3,y+h);sctx.moveTo(x,y+h*i/3);sctx.lineTo(x+w,y+h*i/3);}sctx.stroke();
  // corner + edge handles
  const hs=[[x,y],[x+w/2,y],[x+w,y],[x+w,y+h/2],[x+w,y+h],[x+w/2,y+h],[x,y+h],[x,y+h/2]];
  for(const[hx,hy]of hs){sctx.fillStyle='#f0b23c';sctx.strokeStyle='#20160a';sctx.lineWidth=1;sctx.beginPath();sctx.rect(hx-4,hy-4,8,8);sctx.fill();sctx.stroke();}
  sctx.restore();
}
function drawInteractionOverlay(){
  // crop marquee is persistent while crop tool is active
  if(S.tool==='crop'&&S.cropRect){const r=S.cropRect;marquee(d2s(r.x,r.y),d2s(r.x+r.w,r.y+r.h),true);}
  if(!drag)return;
  if(drag.mode==='shape'&&drag.preview){sctx.save();drawShapePreview(drag.preview);sctx.restore();}
  if(drag.mode==='mask'&&drag.rect){const r=drag.rect,a=d2s(r.x,r.y),b=d2s(r.x+r.w,r.y+r.h);
    sctx.save();sctx.fillStyle='rgba(240,178,60,.14)';sctx.fillRect(a.x,a.y,b.x-a.x,b.y-a.y);
    sctx.lineWidth=1.4;sctx.setLineDash([6,4]);sctx.strokeStyle='#f0b23c';sctx.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y);sctx.restore();}
}
function drawShapePreview(L){
  const a=d2s(L.x,L.y);sctx.save();sctx.translate(a.x,a.y);sctx.scale(view.zoom,view.zoom);sctx.translate(-L.x,-L.y);drawShape(sctx,L);sctx.restore();
}

<script>

/* ---------- history ---------- */

}

  S.cw=s.cw;S.ch=s.ch;S.bg=s.bg;S.sel=s.sel;if(s.groupSeq)S.groupSeq=s.groupSeq;S.selex=[];
  S.layers=s.layers.map(L=>{const o=Object.assign({},L);if(L.bmp)o.bmp=copyCanvas(L.bmp);if(L.warp)o.warp=L.warp.map(p=>({x:p.x,y:p.y}));return o;});

const TOOLS=[

const CUR_DROP=svgCur('<g stroke="#000" stroke-width="2.4" fill="none" stroke-linecap="round"><path d="M18 3a2.4 2.4 0 0 1 3 3l-7.5 7.5-3 1 1-3z"/><path d="M11 8l-7 7a1.6 1.6 0 0 0 0 3l1 1"/></g><g stroke="#fff" stroke-width="1.2" fill="none" stroke-linecap="round"><path d="M18 3a2.4 2.4 0 0 1 3 3l-7.5 7.5-3 1 1-3z"/><path d="M11 8l-7 7a1.6 1.6 0 0 0 0 3l1 1"/></g>',26,26,4,22);

function alignSection(){

  $$('[data-align]').forEach(b=>b.onclick=()=>alignSel(b.dataset.align));

function alignSel(mode){
  const ids=selectedIds();if(!ids.length)return;const set=ids.map(id=>S.layers.find(l=>l.id===id)).filter(l=>l&&l.type!=='raster'&&!l.locked);if(!set.length)return;pushHistory();
  const shift=(L,dx,dy)=>{if(L.warp)L.warp=L.warp.map(p=>({x:p.x+dx,y:p.y+dy}));else{L.x=(L.x||0)+dx;L.y=(L.y||0)+dy;}};
  if(mode==='dh'||mode==='dv'){
    const sorted=set.map(L=>({L,b:layerBBox(L)})).sort((a,b)=>mode==='dh'?a.b.x-b.b.x:a.b.y-b.b.y);
    const first=sorted[0].b,last=sorted[sorted.length-1].b;
    const span=mode==='dh'?(last.x-first.x):(last.y-first.y);const step=span/(sorted.length-1);
    sorted.forEach((o,i)=>{const target=(mode==='dh'?first.x:first.y)+step*i;shift(o.L,mode==='dh'?target-o.b.x:0,mode==='dv'?target-o.b.y:0);});
  }else{
    for(const L of set){const b=layerBBox(L);
      if(mode==='l')shift(L,-b.x,0);else if(mode==='r')shift(L,S.cw-(b.x+b.w),0);else if(mode==='cx')shift(L,(S.cw-b.w)/2-b.x,0);
      else if(mode==='t')shift(L,0,-b.y);else if(mode==='b')shift(L,0,S.ch-(b.y+b.h));else if(mode==='cy')shift(L,0,(S.ch-b.h)/2-b.y);}
  }
  renderAll();renderLayers();
}

/* --- crop --- */
function setCropRect(x,y,w,h){S.cropRect={x:clamp(x,0,S.cw),y:clamp(y,0,S.ch),w:clamp(w,1,S.cw),h:clamp(h,1,S.ch)};}
/* true on-canvas bbox including rotation / warp / flip */
function renderedBBox(L){
  if(L.type==='raster')return{x:0,y:0,w:L.bmp.width,h:L.bmp.height};
  if(L.type==='image'&&L.warp){const xs=L.warp.map(p=>p.x),ys=L.warp.map(p=>p.y);const x=Math.min(...xs),y=Math.min(...ys);return{x,y,w:Math.max(...xs)-x,h:Math.max(...ys)-y};}
  const bb=layerBBox(L),rot=(L.rot||0)*Math.PI/180;if(!rot)return bb;
  const cx=bb.x+bb.w/2,cy=bb.y+bb.h/2;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const[px,py]of[[bb.x,bb.y],[bb.x+bb.w,bb.y],[bb.x+bb.w,bb.y+bb.h],[bb.x,bb.y+bb.h]]){const dx=px-cx,dy=py-cy;const rx=cx+dx*Math.cos(rot)-dy*Math.sin(rot),ry=cy+dx*Math.sin(rot)+dy*Math.cos(rot);x0=Math.min(x0,rx);y0=Math.min(y0,ry);x1=Math.max(x1,rx);y1=Math.max(y1,ry);}
  return{x:x0,y:y0,w:x1-x0,h:y1-y0};
}
/* flatten an image layer's transform into its bitmap (rot/warp/flip → plain pixels) */
function bakeImage(L){
  const bb=renderedBBox(L);
  const x=clamp(Math.floor(bb.x),0,S.cw),y=clamp(Math.floor(bb.y),0,S.ch);
  const w=Math.max(1,Math.min(Math.ceil(bb.w),S.cw-x)),h=Math.max(1,Math.min(Math.ceil(bb.h),S.ch-y));
  const tmp=newCanvas(S.cw,S.ch);drawLayer(tmp.getContext('2d'),Object.assign({},L,{opacity:1,radius:0,borderW:0}));
  const out=newCanvas(w,h);out.getContext('2d').drawImage(tmp,x,y,w,h,0,0,w,h);
  L.bmp=out;L.x=x;L.y=y;L.w=w;L.h=h;delete L.warp;L.rot=0;L.flipH=false;L.flipV=false;
}
function isTransformed(L){return!!(L.rot||L.warp||L.flipH||L.flipV);}
/* crop a single image/raster layer to doc-rect r, actually deleting outside pixels */
function cropImageLayer(L,r){
  if(L.type==='raster'){
    const rx=clamp(Math.round(r.x),0,L.bmp.width),ry=clamp(Math.round(r.y),0,L.bmp.height);
    const rw=Math.max(1,Math.min(Math.round(r.w),L.bmp.width-rx)),rh=Math.max(1,Math.min(Math.round(r.h),L.bmp.height-ry));
    const keep=L.bmp.getContext('2d').getImageData(rx,ry,rw,rh);
    const ctx=L.bmp.getContext('2d');ctx.clearRect(0,0,L.bmp.width,L.bmp.height);ctx.putImageData(keep,rx,ry);return;
  }
  if(!isTransformed(L)){
    const sx=L.bmp.width/L.w,sy=L.bmp.height/L.h;
    const ow=Math.max(1,Math.round(r.w*sx)),oh=Math.max(1,Math.round(r.h*sy));
    const out=newCanvas(ow,oh);out.getContext('2d').drawImage(L.bmp,-(r.x-L.x)*sx,-(r.y-L.y)*sy);
    L.bmp=out;L.x=r.x;L.y=r.y;L.w=r.w;L.h=r.h;
  }else{
    const tmp=newCanvas(S.cw,S.ch);drawLayer(tmp.getContext('2d'),Object.assign({},L,{opacity:1,radius:0,borderW:0}));
    const rx=clamp(Math.round(r.x),0,S.cw),ry=clamp(Math.round(r.y),0,S.ch);
    const rw=Math.max(1,Math.min(Math.round(r.w),S.cw-rx)),rh=Math.max(1,Math.min(Math.round(r.h),S.ch-ry));
    const out=newCanvas(rw,rh);out.getContext('2d').drawImage(tmp,rx,ry,rw,rh,0,0,rw,rh);
    L.bmp=out;L.x=rx;L.y=ry;L.w=rw;L.h=rh;delete L.warp;L.rot=0;L.flipH=false;L.flipV=false;
  }
}

  const html=head('자르기','C','실제로 잘린 결과를 만듭니다. 아래에서 방식을 고르고 영역을 지정하세요.')+
    grp(lab('자르는 대상')+chips('cm',[{v:'image',t:'선택 이미지'},{v:'canvas',t:'캔버스 전체'}],S.cropMode||'image')+
      '<div class="hint" id="cmHint"></div>')+
    grp(lab('비율 프리셋')+chips('cr',[{v:'free',t:'자유'},{v:'1:1',t:'1:1'},{v:'4:5',t:'4:5'},{v:'9:16',t:'9:16'},{v:'16:9',t:'16:9'},{v:'3:4',t:'3:4'}],S.cropRatio||'free'))+

      :'문서(캔버스) 크기를 이 영역으로 바꾸고, <b>바깥 픽셀은 삭제</b>합니다. 모든 레이어가 함께 이동합니다.';};
    setHint();

    wireChips('cr',v=>{S.cropRatio=v;applyCropRatio(v);renderAll();});
    $('#cropApply').onclick=applyCrop;
    $('#cropReset').onclick=()=>{S.cropRatio='free';setCropRect(0,0,S.cw,S.ch);renderInsp();renderAll();};
  }};

function applyCropRatio(v){
  if(v==='free')return;
  const[a,b]=v.split(':').map(Number);let w=S.cw,h=w*b/a;if(h>S.ch){h=S.ch;w=h*a/b;}
  setCropRect((S.cw-w)/2,(S.ch-h)/2,w,h);
}
function applyCrop(){
  const r=S.cropRect;if(!r||r.w<2||r.h<2)return;
  if((S.cropMode||'image')==='image'){
    let L=getSel();if(!L||(L.type!=='image'&&L.type!=='raster'))L=[...S.layers].reverse().find(l=>l.type==='image'||l.type==='raster');
    if(!L){toast('자를 이미지 레이어를 먼저 선택하세요');return;}
    pushHistory();cropImageLayer(L,r);S.sel=L.id;S.selex=[];S.cropRect=null;
    renderAll();renderLayers();renderInsp();setTool('move');toast('이미지를 잘랐습니다');
  }else{
    pushHistory();const nw=Math.round(r.w),nh=Math.round(r.h);
    for(const L of S.layers){
      if(L.type==='raster'){const c=newCanvas(nw,nh);c.getContext('2d').drawImage(L.bmp,-r.x,-r.y);L.bmp=c;}
      else if(L.type==='image'){cropImageLayer(L,r);L.x-=r.x;L.y-=r.y;}
      else{L.x-=r.x;L.y-=r.y;}
    }
    S.cw=nw;S.ch=nh;S.cropRect=null;S.cropRatio='free';
    fitView();renderAll();renderLayers();renderInsp();setTool('move');toast('캔버스를 잘랐습니다');
  }
}

/* --- mask (mosaic/blur/box) --- */
function panelMask(){
  const html=head('모자이크 · 가림','M','드래그한 영역을 선택한 이미지/그림 레이어에 즉시 처리합니다. 여러 번 반복 가능해요.')+
    grp(lab('방식')+chips('mk',[{v:'mosaic',t:'모자이크'},{v:'blur',t:'블러'},{v:'black',t:'검정칠'},{v:'white',t:'흰칠'}],S.maskMode||'mosaic'))+
    grp(lab('강도','<span id="msv">'+(S.maskStr||16)+'</span>')+slider('ms',4,60,S.maskStr||16)+
      '<div class="hint">전화번호·주소·얼굴 등 가릴 영역을 드래그하세요. 대상은 현재 선택된 이미지 레이어입니다.</div>');
  return{html,wire:()=>{
    S.maskMode=S.maskMode||'mosaic';S.maskStr=S.maskStr||16;
    wireChips('mk',v=>{S.maskMode=v;});
    const m=$('#ms');m.oninput=()=>{S.maskStr=+m.value;$('#msv').textContent=m.value;};
  }};
}
function applyMaskRect(r){
  let L=getSel();if(!L||(L.type!=='image'&&L.type!=='raster')){L=[...S.layers].reverse().find(l=>l.type==='image'||l.type==='raster');}
  if(!L){toast('대상 이미지 레이어가 없습니다');return;}
  pushHistory();
  if(L.type==='image'&&isTransformed(L)){bakeImage(L);toast('변형을 확정하고 처리합니다');}
  const ctx=L.bmp.getContext('2d');
  let bx,by,bw,bh;
  if(L.type==='raster'){bx=r.x;by=r.y;bw=r.w;bh=r.h;}
  else{const sx=L.bmp.width/L.w,sy=L.bmp.height/L.h;bx=(r.x-L.x)*sx;by=(r.y-L.y)*sy;bw=r.w*sx;bh=r.h*sy;}
  bx=clamp(Math.round(bx),0,L.bmp.width);by=clamp(Math.round(by),0,L.bmp.height);
  bw=Math.round(Math.min(bw,L.bmp.width-bx));bh=Math.round(Math.min(bh,L.bmp.height-by));
  if(bw<1||bh<1){toast('레이어 밖입니다');return;}
  const mode=S.maskMode,str=S.maskStr;
  if(mode==='black'||mode==='white'){ctx.fillStyle=mode==='black'?'#000':'#fff';ctx.fillRect(bx,by,bw,bh);}
  else if(mode==='mosaic'){
    const cell=Math.max(2,str);const tmp=newCanvas(Math.max(1,bw/cell),Math.max(1,bh/cell));
    tmp.getContext('2d').drawImage(L.bmp,bx,by,bw,bh,0,0,tmp.width,tmp.height);
    ctx.imageSmoothingEnabled=false;ctx.drawImage(tmp,0,0,tmp.width,tmp.height,bx,by,bw,bh);ctx.imageSmoothingEnabled=true;
  }else{ // blur
    const t=newCanvas(bw,bh),tc=t.getContext('2d');tc.filter='blur('+str+'px)';tc.drawImage(L.bmp,bx,by,bw,bh,0,0,bw,bh);
    ctx.drawImage(t,bx,by);
  }
  renderAll();renderLayers();
}

/* --- adjust (sliders + filters + curves) --- */
const ADJ={bright:100,contrast:100,sat:100,warm:0,blur:0,hue:0,curve:[{x:0,y:0},{x:255,y:255}]};
function resetADJ(){Object.assign(ADJ,{bright:100,contrast:100,sat:100,warm:0,blur:0,hue:0,curve:[{x:0,y:0},{x:255,y:255}]});}
function curveIdentity(){return ADJ.curve.length===2&&ADJ.curve[0].y===0&&ADJ.curve[1].y===255;}
function buildLUT(){const p=[...ADJ.curve].sort((a,b)=>a.x-b.x),lut=new Uint8Array(256);let s=0;
  for(let i=0;i<256;i++){while(s<p.length-2&&i>p[s+1].x)s++;const a=p[s],b=p[s+1]||p[s];const t=b.x===a.x?0:(i-a.x)/(b.x-a.x);lut[i]=clamp(Math.round(a.y+(b.y-a.y)*t),0,255);}return lut;}
function enterAdjust(){
  const L=getSel();if(!L||(L.type!=='image'&&L.type!=='raster')){adjCache=null;return;}
  const base=copyCanvas(L.bmp);const hist=new Uint32Array(256);
  try{const im=base.getContext('2d').getImageData(0,0,base.width,base.height).data;for(let i=0;i<im.length;i+=16){const y=(im[i]*0.299+im[i+1]*0.587+im[i+2]*0.114)|0;hist[y]++;}}catch(e){}
  let mx=1;for(const v of hist)if(v>mx)mx=v;
  adjCache={id:L.id,base,hist,histMax:mx};resetADJ();
}
function applyAdjPreview(){
  if(!adjCache)return;const L=S.layers.find(l=>l.id===adjCache.id);if(!L)return;
  const c=L.bmp,ctx=c.getContext('2d');c.width=adjCache.base.width;c.height=adjCache.base.height;
  ctx.clearRect(0,0,c.width,c.height);
  ctx.filter='brightness('+ADJ.bright+'%) contrast('+ADJ.contrast+'%) saturate('+ADJ.sat+'%) blur('+ADJ.blur+'px) hue-rotate('+ADJ.hue+'deg)';
  ctx.drawImage(adjCache.base,0,0);ctx.filter='none';
  if(ADJ.warm!==0){ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=Math.abs(ADJ.warm)/100*.6;
    ctx.fillStyle=ADJ.warm>0?'#ff8a3d':'#3d8aff';ctx.fillRect(0,0,c.width,c.height);ctx.restore();}
  if(!curveIdentity()){const lut=buildLUT();const im=ctx.getImageData(0,0,c.width,c.height),d=im.data;for(let i=0;i<d.length;i+=4){d[i]=lut[d[i]];d[i+1]=lut[d[i+1]];d[i+2]=lut[d[i+2]];}ctx.putImageData(im,0,0);}
  renderAll();
}
function leaveAdjust(apply){
  if(!adjCache){return;}
  const L=S.layers.find(l=>l.id===adjCache.id);
  if(L){
    if(apply){const done=copyCanvas(L.bmp);const b=adjCache.base;L.bmp.width=b.width;L.bmp.height=b.height;L.bmp.getContext('2d').drawImage(b,0,0);pushHistory();L.bmp=done;}
    else{L.bmp.width=adjCache.base.width;L.bmp.height=adjCache.base.height;L.bmp.getContext('2d').drawImage(adjCache.base,0,0);}
  }
  adjCache=null;renderAll();renderLayers();
}
function drawCurveEditor(){
  const cv=$('#curveCv');if(!cv||!adjCache)return;const W=cv.width=cv.clientWidth*dpr(),H=cv.height=cv.clientHeight*dpr();const x=cv.getContext('2d');
  x.clearRect(0,0,W,H);
  x.fillStyle='rgba(139,152,163,.35)';for(let i=0;i<256;i++){const h=adjCache.hist[i]/adjCache.histMax*H;x.fillRect(i/255*W,H-h,W/255+0.5,h);}
  x.strokeStyle='rgba(255,255,255,.08)';x.lineWidth=1;for(let i=1;i<3;i++){x.beginPath();x.moveTo(W*i/3,0);x.lineTo(W*i/3,H);x.moveTo(0,H*i/3);x.lineTo(W,H*i/3);x.stroke();}
  x.strokeStyle='rgba(255,255,255,.15)';x.beginPath();x.moveTo(0,H);x.lineTo(W,0);x.stroke();
  const lut=buildLUT();x.strokeStyle='#f0b23c';x.lineWidth=2;x.beginPath();for(let i=0;i<256;i++){const px=i/255*W,py=H-lut[i]/255*H;i?x.lineTo(px,py):x.moveTo(px,py);}x.stroke();
  for(const p of ADJ.curve){x.fillStyle='#fff';x.strokeStyle='#c8901f';x.lineWidth=2;x.beginPath();x.arc(p.x/255*W,H-p.y/255*H,5*dpr(),0,7);x.fill();x.stroke();}
}

function wireCurve(){
  const box=$('.curvebox');if(!box)return;let dragI=-1;
  const toC=e=>{const r=box.getBoundingClientRect();return{x:clamp((e.clientX-r.left)/r.width*255,0,255),y:clamp((1-(e.clientY-r.top)/r.height)*255,0,255)};};
  const nearest=p=>{let bi=-1,bd=16;const r=box.getBoundingClientRect();ADJ.curve.forEach((q,i)=>{const dx=(q.x-p.x)/255*r.width,dy=(q.y-p.y)/255*r.height;const d=Math.hypot(dx,dy);if(d<bd){bd=d;bi=i;}});return bi;};
  box.addEventListener('pointerdown',e=>{box.setPointerCapture(e.pointerId);const p=toC(e);let i=nearest(p);
    if(i<0){ADJ.curve.push({x:p.x,y:p.y});ADJ.curve.sort((a,b)=>a.x-b.x);i=ADJ.curve.findIndex(q=>q.x===p.x&&q.y===p.y);}
    dragI=i;applyAdjPreview();drawCurveEditor();});
  box.addEventListener('pointermove',e=>{if(dragI<0)return;const p=toC(e);const pt=ADJ.curve[dragI];const isEnd=dragI===0||dragI===ADJ.curve.length-1;
    pt.y=p.y;if(!isEnd){const lo=ADJ.curve[dragI-1].x+1,hi=ADJ.curve[dragI+1].x-1;pt.x=clamp(p.x,lo,hi);}else pt.x=dragI===0?0:255;
    applyAdjPreview();drawCurveEditor();});
  box.addEventListener('pointerup',()=>{dragI=-1;});
  box.addEventListener('dblclick',e=>{const i=nearest(toC(e));if(i>0&&i<ADJ.curve.length-1){ADJ.curve.splice(i,1);applyAdjPreview();drawCurveEditor();}});
}

function ensureRaster(){let L=getSel();if(L&&L.type==='raster')return L;
  L={type:'raster',name:'그림',bmp:newCanvas(S.cw,S.ch)};addLayer(L,{history:false});return L;}
function pickLayerAt(d){
  for(let i=S.layers.length-1;i>=0;i--){const L=S.layers[i];if(!L.visible||L.locked)continue;
    if(L.type==='raster'){
      const x=Math.round(d.x),y=Math.round(d.y);if(x<0||y<0||x>=L.bmp.width||y>=L.bmp.height)continue;
      const a=L.bmp.getContext('2d').getImageData(x,y,1,1).data[3];if(a>8)return L;continue;}
    if(L.type==='image'&&L.warp){if(pointInQuad(L.warp,d.x,d.y))return L;continue;}
    if(pointInLayer(L,d.x,d.y))return L;}
  return null;
}
function pointInLayer(L,px,py){
  const bb=layerBBox(L);const cx=bb.x+bb.w/2,cy=bb.y+bb.h/2,rot=-(L.rot||0)*Math.PI/180;
  const dx=px-cx,dy=py-cy;const lx=dx*Math.cos(rot)-dy*Math.sin(rot)+cx,ly=dx*Math.sin(rot)+dy*Math.cos(rot)+cy;
  return lx>=bb.x&&lx<=bb.x+bb.w&&ly>=bb.y&&ly<=bb.y+bb.h;
}
function pointInQuad(q,px,py){let inside=false;for(let i=0,j=3;i<4;j=i++){const xi=q[i].x,yi=q[i].y,xj=q[j].x,yj=q[j].y;if(((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi))inside=!inside;}return inside;}
function selectLayer(hit,shift){
  if(shift){const i=S.selex.indexOf(hit.id);if(i>=0)S.selex.splice(i,1);else if(hit.id!==S.sel)S.selex.push(hit.id);if(!S.sel)S.sel=hit.id;}
  else{S.sel=hit.id;S.selex=hit.group?S.layers.filter(l=>l.group===hit.group&&l.id!==hit.id).map(l=>l.id):[];}
  if(S.tool==='adjust'){leaveAdjust(false);enterAdjust();}
}
function moveSetFor(L){const ids=new Set([L.id,...S.selex]);
  const addGroup=g=>{if(g)S.layers.forEach(l=>{if(l.group===g)ids.add(l.id);});};
  addGroup(L.group);S.selex.forEach(id=>{const s=S.layers.find(l=>l.id===id);if(s)addGroup(s.group);});
  return[...ids].map(id=>S.layers.find(l=>l.id===id)).filter(Boolean);}
function unionBBox(set){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const L of set){const b=layerBBox(L);x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.w);y1=Math.max(y1,b.y+b.h);}return{x:x0,y:y0,w:x1-x0,h:y1-y0};}
function computeSnap(bb0,dx,dy,set){
  const T=7/view.zoom,mv=new Set(set.map(l=>l.id));
  const vt=[0,S.cw/2,S.cw],ht=[0,S.ch/2,S.ch];
  for(const L of S.layers){if(mv.has(L.id)||!L.visible)continue;const b=layerBBox(L);vt.push(b.x,b.x+b.w/2,b.x+b.w);ht.push(b.y,b.y+b.h/2,b.y+b.h);}
  const guides=[];
  const eV=[bb0.x+dx,bb0.x+bb0.w/2+dx,bb0.x+bb0.w+dx];let bv=T,adjX=0,gv=null;
  for(const e of eV)for(const t of vt){const dd=t-e;if(Math.abs(dd)<bv){bv=Math.abs(dd);adjX=dd;gv=t;}}
  if(gv!=null){dx+=adjX;guides.push({v:gv});}
  const eH=[bb0.y+dy,bb0.y+bb0.h/2+dy,bb0.y+bb0.h+dy];let bh=T,adjY=0,gh=null;
  for(const e of eH)for(const t of ht){const dd=t-e;if(Math.abs(dd)<bh){bh=Math.abs(dd);adjY=dd;gh=t;}}
  if(gh!=null){dy+=adjY;guides.push({h:gh});}
  return{dx,dy,guides};
}
stage.addEventListener('pointerdown',onDown);
function onDown(e){
  stage.setPointerCapture(e.pointerId);
  const d=evtDoc(e),sp=evtStage(e);
  if(e.button===1||e.spaceKey||keyDown.has(' ')){drag={mode:'pan',sx:e.clientX,sy:e.clientY,ox:view.ox,oy:view.oy};return;}
  const T=S.tool;
  if(T==='eyedrop'){sampleColor(d);return;}
  if(T==='move'||T==='text'){
    const wc=warpCornerAt(e);
    if(wc>=0){pushHistory();editing=true;drag={mode:'warp',L:getSel(),ci:wc};return;}
    const h=hitHandle(e);
    if(h){pushHistory();editing=true;drag={mode:'resize',handle:h,L:getSel(),bb:layerBBox(getSel()),start:d,ostart:Object.assign({},getSel())};return;}
    const hit=pickLayerAt(d);
    if(T==='text'&&(!hit||hit.type!=='text')){createText(d.x,d.y);return;}
    if(!hit){if(!e.shiftKey){S.sel=null;S.selex=[];}renderLayers();renderInsp();renderAll();return;}
    selectLayer(hit,e.shiftKey);
    const L=getSel();
    if(L&&!L.locked){const set=moveSetFor(L).filter(x=>x.type!=='raster'&&!x.locked);
      if(set.length){pushHistory();editing=true;drag={mode:'move',set,start:d,bb0:unionBBox(set),guides:[],
        orig:set.map(x=>({L:x,x:x.x||0,y:x.y||0,warp:x.warp?x.warp.map(p=>({...p})):null}))};}}
    renderLayers();renderInsp();renderAll();return;
  }
  if(T==='brush'||T==='eraser'){const L=ensureRaster();pushHistory();drag={mode:'paint',L,er:T==='eraser',last:d};paintDot(L,d);return;}
  if(T==='fill'){bucket(d);return;}
  if(T==='shape'){const L={type:'shape',name:'도형',shape:S.shapeType,x:d.x,y:d.y,w:0,h:0,stroke:S.color,strokeW:S.shapeW||6,fill:S.color2,fillOn:S.shapeFill,radius:S.shapeRadius||0,rot:0,opacity:1,visible:true,id:uid()};drag={mode:'shape',preview:L,start:d};return;}
  if(T==='crop'){
    if(S.cropRect){const hh=cropHandleAt(sp);
      if(hh&&hh!=='inside'){drag={mode:'cropResize',handle:hh,r0:Object.assign({},S.cropRect),start:d};return;}
      if(hh==='inside'){drag={mode:'cropMove',start:d,r0:Object.assign({},S.cropRect)};return;}}
    drag={mode:'crop',start:d};setCropRect(d.x,d.y,1,1);renderAll();return;}
  if(T==='mask'){drag={mode:'mask',start:d,rect:{x:d.x,y:d.y,w:0,h:0}};return;}
}
window.addEventListener('pointermove',onMove);
function cropHandleAt(sp){
  const r=S.cropRect;if(!r)return null;const a=d2s(r.x,r.y),b=d2s(r.x+r.w,r.y+r.h);
  const pts={nw:[a.x,a.y],n:[(a.x+b.x)/2,a.y],ne:[b.x,a.y],e:[b.x,(a.y+b.y)/2],se:[b.x,b.y],s:[(a.x+b.x)/2,b.y],sw:[a.x,b.y],w:[a.x,(a.y+b.y)/2]};
  for(const k in pts){if(Math.hypot(pts[k][0]-sp.x,pts[k][1]-sp.y)<10)return k;}
  if(sp.x>a.x&&sp.x<b.x&&sp.y>a.y&&sp.y<b.y)return 'inside';
  return null;
}
const CROP_CUR={nw:'nwse-resize',se:'nwse-resize',ne:'nesw-resize',sw:'nesw-resize',n:'ns-resize',s:'ns-resize',e:'ew-resize',w:'ew-resize',inside:'move'};
function onMove(e){
  const d=evtDoc(e);hoverDoc={x:d.x,y:d.y,inside:d.x>=0&&d.y>=0&&d.x<S.cw&&d.y<S.ch};
  if(!drag){if(S.tool==='crop'&&S.cropRect){const hh=cropHandleAt(evtStage(e));stage.style.cursor=hh?CROP_CUR[hh]:'crosshair';}updateHUD();return;}
  if(drag.mode==='cropResize'){const h=drag.handle,r=drag.r0;let x1=r.x,y1=r.y,x2=r.x+r.w,y2=r.y+r.h;
    if(h.includes('e'))x2=d.x;if(h.includes('w'))x1=d.x;if(h.includes('s'))y2=d.y;if(h.includes('n'))y1=d.y;
    let nx=Math.min(x1,x2),ny=Math.min(y1,y2),nw=Math.abs(x2-x1),nh=Math.abs(y2-y1);
    if(S.cropRatio&&S.cropRatio!=='free'){const[a,b]=S.cropRatio.split(':').map(Number);nh=nw*b/a;}
    setCropRect(nx,ny,Math.max(6,nw),Math.max(6,nh));renderView();return;}
  if(drag.mode==='cropMove'){const dx=d.x-drag.start.x,dy=d.y-drag.start.y,r=drag.r0;setCropRect(clamp(r.x+dx,0,S.cw-r.w),clamp(r.y+dy,0,S.ch-r.h),r.w,r.h);renderView();return;}
  if(drag.mode==='pan'){view.ox=drag.ox+(e.clientX-drag.sx);view.oy=drag.oy+(e.clientY-drag.sy);renderView();return;}
  if(drag.mode==='move'){
    let dx=d.x-drag.start.x,dy=d.y-drag.start.y;
    const sn=(S.snap&&!e.altKey)?computeSnap(drag.bb0,dx,dy,drag.set):{dx,dy,guides:[]};
    dx=sn.dx;dy=sn.dy;drag.guides=sn.guides;
    for(const o of drag.orig){if(o.warp)o.L.warp=o.warp.map(p=>({x:p.x+dx,y:p.y+dy}));else{o.L.x=o.x+dx;o.L.y=o.y+dy;}}
    renderView();updateHUD();return;}
  if(drag.mode==='warp'){drag.L.warp[drag.ci]={x:d.x,y:d.y};renderView();return;}
  if(drag.mode==='resize'){doResize(d);renderView();return;}
  if(drag.mode==='paint'){paintLine(drag.L,drag.last,d);drag.last=d;renderView();return;}
  if(drag.mode==='shape'){const L=drag.preview;L.w=d.x-drag.start.x;L.h=d.y-drag.start.y;if(e.shiftKey&&(L.shape==='rect'||L.shape==='ellipse')){const s=Math.max(Math.abs(L.w),Math.abs(L.h));L.w=Math.sign(L.w)*s;L.h=Math.sign(L.h)*s;}renderView();return;}
  if(drag.mode==='crop'){let w=d.x-drag.start.x,h=d.y-drag.start.y;let x=drag.start.x,y=drag.start.y;if(w<0){x=d.x;w=-w;}if(h<0){y=d.y;h=-h;}
    if(S.cropRatio&&S.cropRatio!=='free'){const[a,b]=S.cropRatio.split(':').map(Number);h=w*b/a;}
    setCropRect(x,y,w,h);renderView();return;}
  if(drag.mode==='mask'){let w=d.x-drag.start.x,h=d.y-drag.start.y;let x=drag.start.x,y=drag.start.y;if(w<0){x=d.x;w=-w;}if(h<0){y=d.y;h=-h;}drag.rect={x,y,w,h};renderView();return;}
}
window.addEventListener('pointerup',onUp);
function onUp(e){
  if(!drag)return;
  const m=drag.mode;
  if(m==='move'||m==='resize'||m==='paint'||m==='warp'){editEnd();renderLayers();}
  if(m==='shape'){const L=drag.preview;if(Math.abs(L.w)>3||Math.abs(L.h)>3){pushHistory();normalizeShape(L);S.layers.push(L);S.sel=L.id;}}
  if(m==='mask'){if(drag.rect&&drag.rect.w>2&&drag.rect.h>2)applyMaskRect(drag.rect);}
  if(m==='crop'){/* keep rect for apply */}
  drag=null;renderAll();if(m==='shape'){renderLayers();renderInsp();}
}
function normalizeShape(L){if(L.shape==='line'||L.shape==='arrow')return;if(L.w<0){L.x+=L.w;L.w=-L.w;}if(L.h<0){L.y+=L.h;L.h=-L.h;}}
function doResize(d){
  const L=drag.L,o=drag.ostart,h=drag.handle,bb=drag.bb;
  let nx=bb.x,ny=bb.y,nw=bb.w,nh=bb.h;
  if(h.includes('e'))nw=d.x-bb.x; if(h.includes('s'))nh=d.y-bb.y;
  if(h.includes('w')){nw=bb.x+bb.w-d.x;nx=d.x;} if(h.includes('n')){nh=bb.y+bb.h-d.y;ny=d.y;}
  nw=Math.max(8,nw);nh=Math.max(8,nh);
  if(L.type==='image'||L.type==='shape'){L.x=nx;L.y=ny;L.w=nw;L.h=nh;}
  else if(L.type==='text'){const sc=nh/bb.h;L.size=clamp(Math.round((o.size||L.size)*sc),6,600);L.x=nx;L.y=ny;}
}

/* paint helpers */
function paintDot(L,d){const ctx=L.bmp.getContext('2d');ctx.save();if(drag&&drag.er)ctx.globalCompositeOperation='destination-out';ctx.fillStyle=S.color;ctx.globalAlpha=S.brush.hard;ctx.beginPath();ctx.arc(d.x,d.y,S.brush.size/2,0,7);ctx.fill();ctx.restore();}
function paintLine(L,a,b){const ctx=L.bmp.getContext('2d');ctx.save();if(drag.er)ctx.globalCompositeOperation='destination-out';ctx.strokeStyle=S.color;ctx.globalAlpha=S.brush.hard;ctx.lineWidth=S.brush.size;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.restore();}
function bucket(d){let L=getSel();if(!L||L.type!=='raster')L=ensureRaster();
  const x=Math.round(d.x),y=Math.round(d.y);if(x<0||y<0||x>=L.bmp.width||y>=L.bmp.height)return;
  pushHistory();floodFill(L.bmp,x,y,hexToRgb(S.color),S.fillTol||32);renderAll();renderLayers();}
function floodFill(cv,sx,sy,rgb,tol){
  const ctx=cv.getContext('2d'),w=cv.width,h=cv.height,im=ctx.getImageData(0,0,w,h),d=im.data;
  const i0=(sy*w+sx)*4,tr=d[i0],tg=d[i0+1],tb=d[i0+2],ta=d[i0+3];const t2=tol*tol;
  const match=i=>{const dr=d[i]-tr,dg=d[i+1]-tg,db=d[i+2]-tb,da=d[i+3]-ta;return dr*dr+dg*dg+db*db+da*da<=t2*4;};
  const st=[sx,sy];const seen=new Uint8Array(w*h);
  while(st.length){const py=st.pop(),px=st.pop();if(px<0||py<0||px>=w||py>=h)continue;const p=py*w+px;if(seen[p])continue;const i=p*4;if(!match(i))continue;seen[p]=1;d[i]=rgb[0];d[i+1]=rgb[1];d[i+2]=rgb[2];d[i+3]=255;st.push(px+1,py,px-1,py,px,py+1,px,py-1);}
  ctx.putImageData(im,0,0);
}
function sampleColor(d){const x=clamp(Math.round(d.x),0,S.cw-1),y=clamp(Math.round(d.y),0,S.ch-1);const p=docCanvas.getContext('2d').getImageData(x,y,1,1).data;const hex='#'+[p[0],p[1],p[2]].map(n=>n.toString(16).padStart(2,'0')).join('');S.color=hex;renderInsp();toast('색 추출 '+hex.toUpperCase());}

/* fix shape history: capture before push in onUp — redo cleanly */
</script>
<script>
"use strict";
/* ============================================================
   Part C — export, clipboard, files, zoom, keys, batch, init
   ============================================================ */
const modal=$('#batchModal');
function openSheet(title,html,wire){
  modal.querySelector('h2').firstChild.nodeValue=title+' ';
  modal.querySelector('.x').onclick=closeSheet;
  $('#batchBody').innerHTML=html;modal.classList.add('show');if(wire)wire();
}
function closeSheet(){modal.classList.remove('show');}
modal.addEventListener('click',e=>{if(e.target===modal)closeSheet();});

/* ---- image loading ---- */
function loadImageFile(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const c=newCanvas(img.naturalWidth,img.naturalHeight);c.getContext('2d').drawImage(img,0,0);res({bmp:c,name:(file.name||'image').replace(/\.[^.]+$/,'')});};img.onerror=rej;img.src=URL.createObjectURL(file);});}
function loadImageBlob(blob){return loadImageFile(blob);}
function openImageAsDoc(bmp,name){pushHistory();S.cw=bmp.width;S.ch=bmp.height;S.bg="transparent";S.layers=[];S.selex=[];S.fileName=name||'image';
  const L={type:'image',name:'배경',bmp,x:0,y:0,w:bmp.width,h:bmp.height,rot:0};addLayer(L,{history:false});
  fitView();renderAll();renderLayers();renderInsp();}
function addImageLayer(bmp,name){pushHistory();let w=bmp.width,h=bmp.height;const max=Math.min(S.cw,S.ch)*0.9;if(Math.max(w,h)>max){const s=max/Math.max(w,h);w*=s;h*=s;}
  const L={type:'image',name:name||'이미지',bmp,x:(S.cw-w)/2,y:(S.ch-h)/2,w,h,rot:0};addLayer(L,{history:false});}

/* ---- top: open / new ---- */
$('#btnOpen').onclick=()=>$('#fileInput').click();
$('#fileInput').onchange=async e=>{const fs=[...e.target.files];if(!fs.length)return;const first=await loadImageFile(fs[0]);openImageAsDoc(first.bmp,first.name);for(let i=1;i<fs.length;i++){const r=await loadImageFile(fs[i]);addImageLayer(r.bmp,r.name);}e.target.value='';toast('이미지를 불러왔습니다');};
$('#fileAdd').onchange=async e=>{const fs=[...e.target.files];for(const f of fs){const r=await loadImageFile(f);addImageLayer(r.bmp,r.name);}e.target.value='';};
$('#btnNew').onclick=()=>{
  openSheet('새 캔버스',
    '<div class="grp" style="border:none;padding:0">'+lab('규격')+chips('nvp',[{v:'1080x1080',t:'정사각'},{v:'1080x1350',t:'인스타 4:5'},{v:'1080x1920',t:'스토리'},{v:'1280x720',t:'유튜브'}],'1080x1080')+
    '<div class="row" style="margin-top:10px"><div class="field"><span class="fl">가로</span><input class="num" id="nvW" value="1080"></div><div class="field"><span class="fl">세로</span><input class="num" id="nvH" value="1080"></div></div>'+
    '<div class="row" style="margin-top:10px">'+chips('nvbg',[{v:'#ffffff',t:'흰 배경'},{v:'#000000',t:'검정'},{v:'transparent',t:'투명'}],'#ffffff')+'</div>'+
    '<button class="btn acc" id="nvGo" style="margin-top:14px">새 캔버스 만들기</button></div>',
    ()=>{let w=1080,h=1080,bg='#ffffff';
      wireChips('nvp',v=>{const[a,b]=v.split('x').map(Number);w=a;h=b;$('#nvW').value=a;$('#nvH').value=b;});
      $('#nvW').oninput=e=>w=+e.target.value||w;$('#nvH').oninput=e=>h=+e.target.value||h;wireChips('nvbg',v=>bg=v);
      $('#nvGo').onclick=()=>{pushHistory();S.cw=clamp(Math.round(w),16,8000);S.ch=clamp(Math.round(h),16,8000);S.bg=bg;S.layers=[];S.sel=null;S.selex=[];fitView();renderAll();renderLayers();renderInsp();closeSheet();toast('새 캔버스');};
    });
};

/* ---- export ---- */
function toBlob(cv,mime,q){return new Promise(r=>cv.toBlob(r,mime,q));}
function exportCanvas(maxSide){renderDoc();if(!maxSide||Math.max(S.cw,S.ch)<=maxSide)return docCanvas;const s=maxSide/Math.max(S.cw,S.ch);const c=newCanvas(Math.round(S.cw*s),Math.round(S.ch*s));c.getContext('2d').imageSmoothingQuality='high';c.getContext('2d').drawImage(docCanvas,0,0,c.width,c.height);return c;}
function flatten(cv){const c=newCanvas(cv.width,cv.height),x=c.getContext('2d');x.fillStyle='#ffffff';x.fillRect(0,0,c.width,c.height);x.drawImage(cv,0,0);return c;}
async function encodeTarget(cv,mime,kb){let lo=0.25,hi=0.96,best=null;for(let i=0;i<7;i++){const q=(lo+hi)/2;const b=await toBlob(cv,mime,q);if(b.size/1024>kb)hi=q;else{best=b;lo=q;}}return best||await toBlob(cv,mime,0.25);}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}

$('#btnExport').onclick=()=>{
  const EX={fmt:'png',q:0.9,resize:false,maxSide:1600,useTarget:false,targetKB:300,name:S.fileName||'image'};
  openSheet('내보내기',
    '<div class="grp" style="border:none;padding:0">'+
      lab('형식')+chips('exf',[{v:'png',t:'PNG (무손실·투명)'},{v:'jpeg',t:'JPG (사진·작게)'},{v:'webp',t:'WebP (최신·효율)'}],'png')+
      '<div id="qWrap" style="display:none">'+lab('품질','<span id="exqv">90%</span>')+slider('exq',30,100,90)+'</div>'+
      '<div class="row" style="margin-top:12px"><span style="flex:1">크기 축소</span><button class="toggle" id="exrs"></button></div>'+
      '<div id="rsWrap" style="display:none;margin-top:8px">'+lab('긴 변 최대(px)','<span id="exmsv">1600</span>')+slider('exms',400,4000,1600,50)+'</div>'+
      '<div class="row" id="tgRow" style="margin-top:12px;display:none"><span style="flex:1">목표 용량 맞추기</span><button class="toggle" id="extg"></button></div>'+
      '<div id="tgWrap" style="display:none;margin-top:8px">'+lab('목표 용량(KB)','<span id="extv">300</span>')+slider('extk',50,2000,300,10)+'</div>'+
      lab('파일 이름')+'<input class="tin" id="exname" value="'+(EX.name)+'">'+
      '<div class="pill" style="margin-top:12px;width:100%;justify-content:center" id="exest">예상 크기 계산 중…</div>'+
      '<button class="btn acc" id="exGo" style="margin-top:12px">내보내기 · 다운로드</button>'+
    '</div>',
    ()=>{
      const mimeOf=f=>f==='png'?'image/png':f==='jpeg'?'image/jpeg':'image/webp';
      const showQ=()=>{const on=EX.fmt!=='png';$('#qWrap').style.display=on?'':'none';$('#tgRow').style.display=on?'':'none';if(!on){EX.useTarget=false;$('#extg').classList.remove('on');$('#tgWrap').style.display='none';}};
      let estT;const est=()=>{clearTimeout(estT);estT=setTimeout(async()=>{
        let cv=exportCanvas(EX.resize?EX.maxSide:0);if(EX.fmt==='jpeg')cv=flatten(cv);
        let blob;if(EX.useTarget&&EX.fmt!=='png')blob=await encodeTarget(cv,mimeOf(EX.fmt),EX.targetKB);else blob=await toBlob(cv,mimeOf(EX.fmt),EX.q);
        $('#exest').innerHTML=cv.width+'×'+cv.height+' · <b>'+fmtKB(blob.size)+'</b> · '+EX.fmt.toUpperCase();EX._blob=blob;},180);};
      wireChips('exf',v=>{EX.fmt=v;showQ();est();});
      $('#exq').oninput=e=>{EX.q=(+e.target.value)/100;$('#exqv').textContent=e.target.value+'%';est();};
      $('#exrs').onclick=e=>{EX.resize=!EX.resize;e.target.classList.toggle('on',EX.resize);$('#rsWrap').style.display=EX.resize?'':'none';est();};
      $('#exms').oninput=e=>{EX.maxSide=+e.target.value;$('#exmsv').textContent=e.target.value;est();};
      $('#extg').onclick=e=>{EX.useTarget=!EX.useTarget;e.target.classList.toggle('on',EX.useTarget);$('#tgWrap').style.display=EX.useTarget?'':'none';est();};
      $('#extk').oninput=e=>{EX.targetKB=+e.target.value;$('#extv').textContent=e.target.value;est();};
      $('#exname').oninput=e=>EX.name=e.target.value;
      $('#exGo').onclick=async()=>{let cv=exportCanvas(EX.resize?EX.maxSide:0);if(EX.fmt==='jpeg')cv=flatten(cv);
        let blob;if(EX.useTarget&&EX.fmt!=='png')blob=await encodeTarget(cv,mimeOf(EX.fmt),EX.targetKB);else blob=await toBlob(cv,mimeOf(EX.fmt),EX.q);
        const ext=EX.fmt==='jpeg'?'jpg':EX.fmt;download(blob,(EX.name||'image')+'.'+ext);closeSheet();toast('저장됨 · '+fmtKB(blob.size));};
      showQ();est();
    });
};

/* ---- copy to clipboard ---- */
$('#btnCopy').onclick=async()=>{renderDoc();try{const blob=await toBlob(docCanvas,'image/png');await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);toast('클립보드에 복사됨');}catch(err){toast('복사 불가 — 내보내기를 사용하세요');}};

/* ---- SNS safe-area toggle ---- */
$('#btnSafe').onclick=()=>{S.safeArea=!S.safeArea;$('#btnSafe').classList.toggle('on',S.safeArea);renderView();toast(S.safeArea?'안전영역 표시':'안전영역 숨김');};

/* ---- project save / load (.json) ---- */
$('#btnProjSave').onclick=async()=>{
  const layers=S.layers.map(L=>{const o=Object.assign({},L);delete o._lines;delete o._lh;delete o._w;delete o._h;
    if(L.bmp){o.bmp=L.bmp.toDataURL('image/png');}return o;});
  const proj={app:'image-bench',ver:2,cw:S.cw,ch:S.ch,bg:S.bg,groupSeq:S.groupSeq,layers};
  const blob=new Blob([JSON.stringify(proj)],{type:'application/json'});
  download(blob,(S.fileName||'project')+'.json');toast('프로젝트 저장됨(.json)');
};
$('#btnProjOpen').onclick=()=>$('#projFile').click();
$('#projFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=async()=>{try{const proj=JSON.parse(rd.result);if(!proj.layers)throw 0;
    pushHistory();S.cw=proj.cw;S.ch=proj.ch;S.bg=proj.bg;S.groupSeq=proj.groupSeq||1;
    const layers=[];
    for(const o of proj.layers){const L=Object.assign({},o);
      if(typeof o.bmp==='string'){L.bmp=await dataURLToCanvas(o.bmp);}
      layers.push(L);}
    S.layers=layers;S.sel=layers.length?layers[layers.length-1].id:null;S.selex=[];
    fitView();renderAll();renderLayers();renderInsp();toast('프로젝트 불러옴');
  }catch(err){toast('열 수 없는 파일입니다');}};
  rd.readAsText(f);e.target.value='';};
function dataURLToCanvas(url){return new Promise(res=>{const img=new Image();img.onload=()=>{const c=newCanvas(img.naturalWidth,img.naturalHeight);c.getContext('2d').drawImage(img,0,0);res(c);};img.src=url;});}

/* ---- paste ---- */
window.addEventListener('paste',async e=>{const items=[...(e.clipboardData?.items||[])];const it=items.find(i=>i.type.startsWith('image/'));if(!it)return;const file=it.getAsFile();if(!file)return;const r=await loadImageBlob(file);if(!S.layers.length)openImageAsDoc(r.bmp,'붙여넣기');else addImageLayer(r.bmp,'붙여넣기');toast('붙여넣기됨');});

/* ---- drag & drop ---- */
;['dragenter','dragover'].forEach(ev=>stagewrap.addEventListener(ev,e=>{e.preventDefault();stage.classList.add('draghot');}));
;['dragleave','drop'].forEach(ev=>stagewrap.addEventListener(ev,e=>{e.preventDefault();if(ev==='drop'||e.target===stagewrap)stage.classList.remove('draghot');}));

const keyDown=new Set();
window.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();const typing=tag==='input'||tag==='textarea'||e.target.isContentEditable;
  keyDown.add(e.key);
  if(e.key===' '&&!typing){stage.style.cursor='grab';e.preventDefault();}
  if(typing)return;
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?doRedo():doUndo();return;}
  if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();doRedo();return;}
  if(mod&&e.key.toLowerCase()==='g'){e.preventDefault();toggleGroup();return;}
  if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();$('#btnProjSave').click();return;}
  if(mod)return;
  if(e.key==='Delete'||e.key==='Backspace'){if(getSel()){e.preventDefault();deleteLayer();}return;}
  const map={v:'move',t:'text',b:'brush',e:'eraser',g:'fill',u:'shape',i:'eyedrop',c:'crop',m:'mask'};
  const k=e.key.toLowerCase();if(map[k]){setTool(map[k]);}
  if(e.key==='+'||e.key==='=')setZoom(view.zoom*1.2);if(e.key==='-')setZoom(view.zoom/1.2);
  if(e.key==='0'){fitView();renderView();updateHUD();}
});

const FACTCHAT_ENDPOINT='https://factchat.mindlogic-kr-api.com/v1/gateway/chatbots/47956/chat/completions';
// 테스트용 직접 호출 키입니다. 운영 배포에서는 HTML에 키를 넣지 말고 프록시 서버에 숨기세요.
const FACTCHAT_API_KEY='QgGMDfsCHW2TXgDYCEdzeWlnsKkovVv7';
const FACTCHAT_PROXY_MODE=false;
const FACTCHAT_KEY_SESSION='kanvas_factchat_api_key';
const aiChatState={messages:[],busy:false};
function aiHelpAppend(role,text){
  const log=$('#aiLog');if(!log)return;

function aiHelpSetBusy(on){

function aiHelpErrorMessage(status,raw){
  const msg=(typeof raw==='string'?raw:JSON.stringify(raw||{}));
  if(status===401||status===403)return 'API 키가 없거나 권한이 없습니다. FACTCHAT_API_KEY를 확인해 주세요.';
  if(status===402||status===429||/quota|limit|token|credit|insufficient|rate/i.test(msg))return '현재 토큰 또는 사용 한도 문제로 답변을 못했습니다. 잠시 후 다시 시도하거나 API 키/사용량을 확인해 주세요.';
  if(status>=500)return 'FactChat 서버 응답이 불안정합니다. 잠시 후 다시 시도해 주세요.';
  return '답변을 가져오지 못했습니다. 네트워크 상태, API 키, 엔드포인트 설정을 확인해 주세요.';
}
async function aiAskFactChat(question){
  const key=(FACTCHAT_API_KEY||'').trim();
  if(!FACTCHAT_PROXY_MODE&&!key){
    aiHelpAppend('error','테스트용 API 키가 HTML에 설정되어 있지 않습니다. FACTCHAT_API_KEY 값을 확인해 주세요.');
    return;
  }
  aiChatState.messages.push({role:'user',content:question});
  const payloadMessages=[
    {role:'system',content:'너는 브라우저 이미지 편집기 "포도샵"(이미지 작업대)의 사용법 도우미다. 업로드된 지식(질문→경로→단계 카드)만 근거로 답한다. 형식: 첫 줄에 \'경로: A → B → C\' 클릭 경로를 화살표로 쓰고, 이어서 3~7단계 번호로 어느 화면의 어떤 버튼/슬라이더인지 실제 이름 그대로 설명하고, 마지막에 한 줄 팁 또는 안 될 때 대처를 덧붙인다. 왼쪽 도구 막대(캔버스·선택·스포이드·텍스트·브러시·지우개·채우기·도형·자르기·모자이크·보정·배경)와 상단바(열기·저장·불러오기·되돌리기·안전영역·복사·내보내기), 오른쪽 레이어 패널 명칭을 정확히 쓴다. 지식에 없는 기능은 지어내지 말고 \'현재 버전엔 없다\'고 한다. 이 도우미는 편집을 직접 하지 않고 방법만 안내한다. AI 누끼가 안 되면 최신 크롬(WebGPU)·정식 브라우저·단색 배경 제거+지우개 대안을 안내한다. 모든 처리는 브라우저 안에서만 일어나 사진이 서버로 전송되지 않는다.'},
    ...aiChatState.messages.slice(-10)
  ];
  aiHelpSetBusy(true);
  const waiting=aiHelpAppend('bot','답변을 가져오는 중입니다...');
  try{
    const headers={'Content-Type':'application/json'};
    if(!FACTCHAT_PROXY_MODE)headers.Authorization='Bearer '+key;
    const res=await fetch(FACTCHAT_ENDPOINT,{
      method:'POST',
      headers,
      body:JSON.stringify({model:'chatbot',messages:payloadMessages})
    });
    let data=null,txt='';
    try{data=await res.json();}catch(_){txt=await res.text().catch(()=>'');}
    if(!res.ok){
      waiting.remove();
      aiHelpAppend('error',aiHelpErrorMessage(res.status,data||txt));
      aiChatState.messages.pop();
      return;
    }
    const answer=data?.choices?.[0]?.message?.content || data?.message?.content || data?.answer || '';
    waiting.remove();
    if(!answer){
      aiHelpAppend('error','FactChat 응답은 왔지만 답변 본문을 찾지 못했습니다. 응답 형식을 확인해 주세요.');
      return;
    }
    aiChatState.messages.push({role:'assistant',content:answer});
    aiHelpAppend('bot',answer);
  }catch(err){
    waiting.remove();
    aiChatState.messages.pop();
    aiHelpAppend('error','브라우저에서 API 호출이 차단됐거나 네트워크 연결이 실패했습니다. CORS 문제가 나면 HTML에서 직접 호출하지 말고, FACTCHAT_API_KEY를 서버에 숨기는 프록시를 거쳐 호출해야 합니다.');
  }finally{aiHelpSetBusy(false);}
}
function initAIHelp(){
  const form=$('#aiForm'),q=$('#aiQuestion'),clear=$('#aiClear');

    aiChatState.messages=[];

  };

    e.preventDefault();
    const question=(q.value||'').trim();

<script>
"use strict";
/* ============================================================

/* styles + overlay (self-contained) */
