function aiHide(){document.getElementById('aiOverlay').classList.remove('show');}
function aiStatus(t){const el=document.getElementById('aiStatus');if(el)el.textContent=t;}
function aiBar(p){const el=document.getElementById('aiBar');if(el)el.style.width=Math.max(0,Math.min(100,p))+'%';}

/* ---- worker source (module worker, cross-origin ESM) ---- */
const AI_TRANSFORMERS_URL='https://cdn.jsdelivr.net/npm/@huggingface/transformers@3';
const AI_WORKER_SRC=`
let T=null, model=null, processor=null, curId=null, RawImageC=null;
const CDN=${JSON.stringify(AI_TRANSFORMERS_URL)};
async function ensureLib(){ if(T)return T; T=await import(CDN); RawImageC=T.RawImage; T.env.allowLocalModels=false; return T; }
async function loadModel(id, prog){
  if(curId===id && model) return;
  const {AutoModel,AutoProcessor}=await ensureLib();
  const pc={progress_callback:prog};
  const rmbgProcCfg={config:{do_normalize:true,do_pad:false,do_rescale:true,do_resize:true,image_mean:[0.5,0.5,0.5],image_std:[1,1,1],resample:2,rescale_factor:0.00392156862745098,size:{width:1024,height:1024}}};
  async function build(device){
    if(id==='briaai/RMBG-1.4'){
      model=await AutoModel.from_pretrained(id,Object.assign({config:{model_type:'custom'}},device?{device}:{},pc));
      processor=await AutoProcessor.from_pretrained(id,rmbgProcCfg);
    }else{
      model=await AutoModel.from_pretrained(id,Object.assign({dtype:'fp32'},device?{device}:{},pc));
      processor=await AutoProcessor.from_pretrained(id);
    }
  }
  try{ await build('webgpu'); }
  catch(e){ try{ await build(null); }catch(e2){ throw e2; } }
  curId=id;
}
self.onmessage=async(e)=>{
  const d=e.data;
  if(d.type!=='run')return;
  try{
    await loadModel(d.modelId, p=>{ self.postMessage({type:'progress',data:p}); });
    self.postMessage({type:'stage',msg:'이미지 분석 중…'});
    const image=new RawImageC(new Uint8ClampedArray(d.buf), d.width, d.height, 4);
    const inp=await processor(image);
    const out=await model({input:inp.pixel_values});
    const key=('output' in out)?'output':Object.keys(out)[0];
    let t=out[key]; t=t[0]?t[0]:t;
    const mimg=await RawImageC.fromTensor(t.mul(255).to('uint8')).resize(d.width,d.height);
    const src=mimg.data; const n=d.width*d.height; const u8=new Uint8Array(n);
    const ch=src.length/n|0;
    for(let i=0;i<n;i++)u8[i]=src[i*ch];
    self.postMessage({type:'result',width:d.width,height:d.height,mask:u8.buffer},[u8.buffer]);
  }catch(err){ self.postMessage({type:'error',message:String(err&&err.message||err)}); }
};
`;

let aiWorker=null, aiPending=null, aiToken=0;
function ensureAIWorker(){
  if(aiWorker)return aiWorker;
  const url=URL.createObjectURL(new Blob([AI_WORKER_SRC],{type:'text/javascript'}));
  aiWorker=new Worker(url,{type:'module'});
  aiWorker.onmessage=e=>{
    const d=e.data;
    if(d.type==='progress'){const p=d.data||{};
      if(p.status==='progress'&&p.total){aiBar(p.loaded/p.total*100);aiStatus('모델 다운로드 '+Math.round(p.loaded/p.total*100)+'% ('+(p.file||'')+')');}
      else if(p.status==='download'||p.status==='initiate'){aiStatus('모델 파일 준비 중… '+(p.file||''));}
      else if(p.status==='done'){/* file done */}
      return;}
    if(d.type==='stage'){aiStatus(d.msg);aiBar(100);return;}
    if(d.type==='result'){if(aiPending){aiPending.resolve({mask:new Uint8Array(d.mask),width:d.width,height:d.height});aiPending=null;}return;}
    if(d.type==='error'){if(aiPending){aiPending.reject(new Error(d.message));aiPending=null;}return;}
  };
  aiWorker.onerror=e=>{if(aiPending){aiPending.reject(new Error('worker:'+(e.message||'init failed')));aiPending=null;}};
  return aiWorker;
}
function runAIMatting(modelId,bmp){
  return new Promise((resolve,reject)=>{
    ensureAIWorker();
    const im=bmp.getContext('2d').getImageData(0,0,bmp.width,bmp.height);
    const buf=im.data.buffer; // fresh buffer from getImageData -> transferable
    aiPending={resolve,reject};
    aiWorker.postMessage({type:'run',modelId,width:bmp.width,height:bmp.height,buf},[buf]);
  });
}
/* main-thread fallback if worker can't be created / errors immediately */
let AIT=null;
async function aiMatteMain(modelId,bmp,onProg){
  if(!AIT){AIT=await import(AI_TRANSFORMERS_URL);AIT.env.allowLocalModels=false;}
  const {AutoModel,AutoProcessor,RawImage}=AIT;
  const rmbgCfg={config:{do_normalize:true,do_pad:false,do_rescale:true,do_resize:true,image_mean:[0.5,0.5,0.5],image_std:[1,1,1],resample:2,rescale_factor:0.00392156862745098,size:{width:1024,height:1024}}};
  let model,processor;
  async function build(device){
    if(modelId==='briaai/RMBG-1.4'){model=await AutoModel.from_pretrained(modelId,Object.assign({config:{model_type:'custom'}},device?{device}:{},{progress_callback:onProg}));processor=await AutoProcessor.from_pretrained(modelId,rmbgCfg);}
    else{model=await AutoModel.from_pretrained(modelId,Object.assign({dtype:'fp32'},device?{device}:{},{progress_callback:onProg}));processor=await AutoProcessor.from_pretrained(modelId);}
  }
  try{await build('webgpu');}catch(e){await build(null);}
  const im=bmp.getContext('2d').getImageData(0,0,bmp.width,bmp.height);
  const image=new RawImage(new Uint8ClampedArray(im.data),bmp.width,bmp.height,4);
  const inp=await processor(image);
  const out=await model({input:inp.pixel_values});
  const key=('output' in out)?'output':Object.keys(out)[0];let t=out[key];t=t[0]?t[0]:t;
  const mimg=await RawImage.fromTensor(t.mul(255).to('uint8')).resize(bmp.width,bmp.height);
  const src=mimg.data,n=bmp.width*bmp.height,u8=new Uint8Array(n),ch=src.length/n|0;
  for(let i=0;i<n;i++)u8[i]=src[i*ch];
  return{mask:u8,width:bmp.width,height:bmp.height};
}

/* ---- AI refine cache (like adjust preview) ---- */
let aiCache=null; // {id, base(canvas), mask(Uint8), w, h}
function aiModelId(){return S.aiModel==='modnet'?'Xenova/modnet':'briaai/RMBG-1.4';}
async function runAIBg(L){
  if(!L||L.type!=='image'){toast('이미지 레이어를 선택하세요');return;}

  let res=null;

    try{ res=await runAIMatting(aiModelId(),L.bmp); }
    catch(werr){ aiStatus('메인 스레드로 처리 시도 중…'); res=await aiMatteMain(aiModelId(),L.bmp,p=>{if(p&&p.total)aiBar(p.loaded/p.total*100);}); }
  }catch(err){
    aiHide();
    toast('AI 처리 실패 — 아래 단색 배경 제거를 사용하세요');

  }

}
function buildMaskCanvas(){
  const {w,h,mask}=aiCache,o=S.aiOpt;
  // 1) raw mask -> alpha canvas
  let mc=newCanvas(w,h);const mx=mc.getContext('2d');
  const id=mx.createImageData(w,h),dd=id.data;
  const inv=o.invert;
  for(let i=0;i<w*h;i++){const v=inv?255-mask[i]:mask[i];dd[i*4]=255;dd[i*4+1]=255;dd[i*4+2]=255;dd[i*4+3]=v;}
  mx.putImageData(id,0,0);
  // 2) feather (blur)
  if(o.feather>0){const b=newCanvas(w,h),bx=b.getContext('2d');bx.filter='blur('+o.feather+'px)';bx.drawImage(mc,0,0);mc=b;}
  // 3) shrink + threshold on alpha
  const fx=mc.getContext('2d');const fid=fx.getImageData(0,0,w,h),fd=fid.data;
  const sh=o.shrink/22, th=o.threshold/255;
  for(let i=0;i<w*h;i++){let a=fd[i*4+3]/255; a=a-sh; if(a<th)a=0; if(a<0)a=0; if(a>1)a=1; fd[i*4+3]=Math.round(a*255);}
  fx.putImageData(fid,0,0);
  return mc;
}
function applyAIPreview(){
  if(!aiCache)return;const L=S.layers.find(l=>l.id===aiCache.id);if(!L)return;
  const w=aiCache.base.width,h=aiCache.base.height;
  const mc=buildMaskCanvas();
  const out=newCanvas(w,h),ox=out.getContext('2d');
  ox.drawImage(aiCache.base,0,0);
  ox.globalCompositeOperation='destination-in';
  ox.drawImage(mc,0,0,w,h);
  L.bmp.width=w;L.bmp.height=h;const lc=L.bmp.getContext('2d');lc.clearRect(0,0,w,h);lc.drawImage(out,0,0);
  renderAll();
}
function leaveAI(apply){
  if(!aiCache)return;const L=S.layers.find(l=>l.id===aiCache.id);
  if(L){
    if(apply){const done=copyCanvas(L.bmp);const b=aiCache.base;L.bmp.width=b.width;L.bmp.height=b.height;L.bmp.getContext('2d').drawImage(b,0,0);pushHistory();L.bmp=done;}
    else{L.bmp.width=aiCache.base.width;L.bmp.height=aiCache.base.height;L.bmp.getContext('2d').drawImage(aiCache.base,0,0);}
  }
  aiCache=null;renderAll();renderLayers();
}

/* ---- cancel AI refine when leaving bg tool / changing layer ---- */
const _setTool_ai=setTool;
setTool=function(id){ if(S.tool==='bg'&&id!=='bg'&&aiCache)leaveAI(false); return _setTool_ai(id); };

/* ---- enhanced bg panel with AI section ---- */
panelBg=function(){
  const L=getSel();
  if(!L||L.type!=='image')return{html:head('배경 제거','F','이미지 레이어를 선택하세요.')+grp('<div class="hint">배경을 제거할 이미지 레이어를 먼저 선택하세요. 결과는 투명 PNG로 저장됩니다.</div>'),wire:()=>{}};
  if(aiCache&&aiCache.id===L.id){
    const o=S.aiOpt||{threshold:8,feather:1,shrink:0,invert:false};
    const html=head('AI 누끼 다듬기','AI','가장자리를 정리한 뒤 적용하세요. 값은 실시간 미리보기입니다.')+
      grp(lab('임계값','<span id="aiTv">'+o.threshold+'</span>')+slider('aiT',0,200,o.threshold)+
        lab('부드럽게(px)','<span id="aiFv">'+o.feather+'</span>')+slider('aiF',0,12,o.feather)+
        lab('가장자리 축소','<span id="aiSv">'+o.shrink+'</span>')+slider('aiS',0,20,o.shrink)+
        '<div class="row" style="margin-top:10px"><span style="flex:1">전경/배경 반전</span><button class="toggle'+(o.invert?' on':'')+'" id="aiInv"></button></div>')+
      grp('<button class="btn acc" id="aiApply">누끼 적용</button><button class="btn ghost" id="aiCancel" style="margin-top:7px">취소</button>'+
        '<button class="btn ghost" id="aiRerun" style="margin-top:7px">AI 다시 실행</button>');
    return{html,wire:()=>{
      const bind=(id,key,fmt)=>{const el=$('#ai'+id);el.oninput=()=>{S.aiOpt[key]=+el.value;$('#ai'+id.charAt(0)+'v').textContent=el.value;applyAIPreview();};};
      const t=$('#aiT');t.oninput=()=>{S.aiOpt.threshold=+t.value;$('#aiTv').textContent=t.value;applyAIPreview();};
      const f=$('#aiF');f.oninput=()=>{S.aiOpt.feather=+f.value;$('#aiFv').textContent=f.value;applyAIPreview();};
      const s=$('#aiS');s.oninput=()=>{S.aiOpt.shrink=+s.value;$('#aiSv').textContent=s.value;applyAIPreview();};
      $('#aiInv').onclick=e=>{S.aiOpt.invert=!S.aiOpt.invert;e.target.classList.toggle('on',S.aiOpt.invert);applyAIPreview();};
      $('#aiApply').onclick=()=>{leaveAI(true);renderInsp();toast('누끼 적용됨');};
      $('#aiCancel').onclick=()=>{leaveAI(false);renderInsp();};
      $('#aiRerun').onclick=()=>{const id=aiCache.id;leaveAI(false);const LL=S.layers.find(l=>l.id===id);S.sel=id;runAIBg(LL);};
    }};
  }
  S.aiModel=S.aiModel||'rmbg';
  const html=head('배경 제거','F','AI 자동 누끼 또는 단색 배경 제거를 사용할 수 있습니다.')+
    grp(lab('AI 자동 누끼')+chips('aim',[{v:'rmbg',t:'범용 (RMBG)'},{v:'modnet',t:'인물 (MODNet)'}],S.aiModel)+
      '<button class="btn acc" id="aiRun" style="margin-top:10px">AI로 배경 제거</button>'+
      '<div class="hint">처음 실행 시 모델을 한 번 내려받습니다(수십 MB, 이후 캐시). 인터넷 연결과 최신 브라우저(WebGPU 권장)가 필요합니다. 인물 사진은 <b>인물(MODNet)</b>이 더 깔끔할 수 있어요.</div>')+
    grp(lab('단색 배경 제거')+'<div class="btn2"><button class="btn" id="bgWhite">흰 배경</button><button class="btn" id="bgGreen">초록 배경</button></div>'+
      lab('허용치','<span id="bgtv">40</span>')+slider('bgt',5,150,40)+
      '<div class="row" style="margin-top:8px">'+swatch('bgc',S.color)+'<button class="btn" id="bgPick" style="flex:1">이 색을 투명하게</button></div>')+
    grp('<button class="btn ghost" id="toEraser">지우개로 수동 정리</button>');
  return{html,wire:()=>{
    wireChips('aim',v=>{S.aiModel=v;});
    $('#aiRun').onclick=()=>runAIBg(L);
    S.bgTol=40;const t=$('#bgt');t.oninput=()=>{S.bgTol=+t.value;$('#bgtv').textContent=t.value;};
    $('#bgWhite').onclick=()=>removeColorLayer(L,[255,255,255]);
    $('#bgGreen').onclick=()=>removeColorLayer(L,[0,177,64]);
    bindColor('bgc',c=>{S.color=c;});
    $('#bgPick').onclick=()=>removeColorLayer(L,hexToRgb(S.color));
    $('#toEraser').onclick=()=>setTool('eraser');
  }};
};
</script>
